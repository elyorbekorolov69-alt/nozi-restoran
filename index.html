        ${isTab() ? "" : view3DHTML(metaText())}
        <div class="chips" role="toolbar" aria-label="Bo‘limlar">
          ${MENU.map(s => `<button class="chip" type="button" data-sec="${s.id}" aria-pressed="${(bk.sec || MENU[0].id) === s.id}">${esc(s.uz)}</button>`).join("")}
        </div>
        <div id="pkl">${pickList()}</div>` + nav("Orqaga", "Tartibni ko‘rish", chosenItems().length > 0);
    } else if (bk.step === 3) {
      const items = chosenItems(), warns = courseWarnings();
      html += `<h3 class="bk-h">Taomlar qachon chiqadi</h3>
        <p class="bk-todo"><span><b>Nima qilish kerak:</b> taomlar qaysi paytda tortilishini tekshiring. Hammasi to‘g‘ri bo‘lsa, “Hisobni ko‘rish” ga o‘ting. O‘zgartirmoqchi bo‘lsangiz, taom yonidagi ro‘yxatdan boshqa paytni tanlang.</span></p>
        <p class="bk-p">Qaysi taom qachon tortilishini o‘zimiz ajratdik: sovuq gazak, salat, non va ichimliklar mehmonlar kelguncha dasturxonda turadi, sho‘rva 1-taom, issiq taomlar 2-taom, shashlik 3-taom. Kerak bo‘lsa o‘zgartiring.</p>
        ${isTab() ? "" : view3DHTML("Yuqoridagi tugmalar bilan har bir payt dasturxonini ko‘ring")}
        ${warns.map(w => `<p class="warn">${w}</p>`).join("")}
        ${COURSES.map(([k, name]) => {
          const g = items.filter(x => x.course === k);
          if (!g.length) return "";
          return `<div class="course-group"><h4>${name} <small>${g.length} xil</small></h4>${g.map(x => `<div class="cg-row"><span>${esc(x.d.uz)} <small>× ${x.q}${tablesNow() > 1 ? ` · ${tableOf(x.d.id) + 1}-${tblWord()}` : ""}</small></span>
            <select data-course="${x.d.id}" aria-label="${esc(x.d.uz)}: qachon tortiladi">${COURSES.map(([k2, n2]) => `<option value="${k2}" ${k2 === k ? "selected" : ""}>${n2}</option>`).join("")}</select></div>`).join("")}</div>`;
        }).join("")}
      ` + nav("Orqaga", "Hisobni ko‘rish");
    } else if (bk.step === 4) {
      const items = chosenItems(), us = units(), food = foodTotal(), fee = food * SERVICE, unk = unpriced(), multi = us.length > 1;
      const dishRow = x => `<tr><td>${esc(x.d.uz)}${x.d.s ? ` <span class="tag">taxminiy</span>` : ""}</td><td>${x.q}</td><td>${x.d.n == null ? `<span class="muted">aniqlanmoqda</span>` : fmt(x.d.n)}</td><td>${x.d.n == null ? "—" : fmt(x.d.n * x.q)}</td></tr>`;
      const colName = shapeNow() === "round" ? "Stolga" : "10 kishiga";
      let rows;
      if (!multi) {
        const u = us[0];
        rows = `<tbody>${COURSES.map(([k, name]) => {
          const g = items.filter(x => x.course === k);
          return g.length ? `<tr><td colspan="4" class="muted">${name}</td></tr>` + g.map(dishRow).join("") : "";
        }).join("")}</tbody>
          <tbody>
            <tr class="sum"><td colspan="3">${shapeNow() === "round" ? "Bitta stol" : "Har 10 kishi"}</td><td>${fmt(u.one)}</td></tr>
            <tr class="sum"><td colspan="3">${shapeNow() === "round" ? "Stollar soni" : "Qismlar soni"}</td><td>× ${u.sets}</td></tr>
            <tr class="sum"><td colspan="3">Taomlar jami</td><td>${fmt(food)}</td></tr>`;
      } else {
        rows = us.map((u, i) => `<tbody><tr><td colspan="4" class="muted"><b>${i + 1}-${tblWord()}</b> · ${u.guests} kishi</td></tr>` +
          (u.items.length ? u.items.map(dishRow).join("") : `<tr><td colspan="4"><span class="muted">Bu ${tblWord()}ga taom tushmadi</span></td></tr>`) +
          `<tr class="sum"><td colspan="3">${i + 1}-${tblWord()} jami${u.sets > 1 ? ` (${fmt(u.one)} × ${u.sets})` : ""}</td><td>${fmt(u.cost)}</td></tr></tbody>`).join("") +
          `<tbody><tr class="sum"><td colspan="3">Taomlar jami</td><td>${fmt(food)}</td></tr>`;
      }
      const tabMulti = multi && isTab();
      const tabBill = !tabMulti ? "" : `<div class="bill-grid">${us.map((u, i) => `<div class="bill-wrap"><table class="bill">
          <thead><tr><th colspan="4">${i + 1}-${tblWord()} · ${u.guests} kishi</th></tr><tr><th>Taom</th><th>${colName}</th><th>Narx</th><th>Jami</th></tr></thead>
          <tbody>${u.items.length ? u.items.map(dishRow).join("") : `<tr><td colspan="4"><span class="muted">Bu ${tblWord()}ga taom tushmadi</span></td></tr>`}
          <tr class="sum"><td colspan="3">${i + 1}-${tblWord()} jami${u.sets > 1 ? ` (${fmt(u.one)} × ${u.sets})` : ""}</td><td>${fmt(u.cost)}</td></tr></tbody></table></div>`).join("")}</div>
        <div class="bill-wrap bill-wide"><table class="bill">
          <thead><tr><th>${tblWord()[0].toUpperCase() + tblWord().slice(1)}</th><th>Kishi</th><th>Taom</th><th>Summa</th></tr></thead>
          <tbody>${us.map((u, i) => `<tr><td>${i + 1}-${tblWord()}</td><td>${u.guests}</td><td>${u.items.length} xil</td><td>${fmt(u.cost)}</td></tr>`).join("")}</tbody>
          <tbody><tr class="sum"><td colspan="3">Taomlar jami</td><td>${fmt(food)}</td></tr>
            <tr class="sum"><td colspan="3">Ofitsiantlar xizmati, ${SERVICE_PCT}</td><td>${fmt(fee)}</td></tr>
            <tr class="total"><td colspan="3">Jami</td><td>${fmt(food + fee)} so‘m</td></tr></tbody></table></div>`;
      html += `<h3 class="bk-h">Hisob</h3>
        <p class="bk-todo"><span><b>Nima qilish kerak:</b> narxlarni ko‘rib chiqing. Bu taxminiy hisob, yakuniy narxni restoran tasdiqlaydi. Rozi bo‘lsangiz, “So‘rov qoldirish” ni bosing.</span></p>
        <p class="bk-p">${h.name} · ${bk.guests} kishi · ${tableText()}</p>
        ${tabMulti ? tabBill : `<div class="bill-wrap"><table class="bill">
          <thead><tr><th>Taom</th><th>${colName}</th><th>Narx</th><th>Jami</th></tr></thead>
          ${rows}
            <tr class="sum"><td colspan="3">Ofitsiantlar xizmati, ${SERVICE_PCT}</td><td>${fmt(fee)}</td></tr>
            <tr class="total"><td colspan="3">Jami</td><td>${fmt(food + fee)} so‘m</td></tr>
          </tbody></table></div>`}
        ${multi && items.length < us.length ? `<p class="warn">${us.length} ta ${tblWord()} bor, taom esa ${items.length} xil. ${items.length + 1}-${tblWord()}dan boshlab taom tushmadi.</p>` : ""}
        ${unk.length ? `<p class="note">${unk.map(x => esc(x.d.uz)).join(", ")} narxi hali kiritilmagan, jami summaga qo‘shilmadi.</p>` : ""}
        ${items.some(x => x.d.s) ? `<p class="note"><span class="tag">taxminiy</span> belgili narxlar restoran bilan tasdiqlanmoqda.</p>` : ""}
      ` + nav("Orqaga", "So‘rov qoldirish");
    } else if (!bk.sent) {
      html += `<h3 class="bk-h">Ism va telefon</h3>
        <p class="bk-todo"><span><b>Nima qilish kerak:</b> ismingiz va telefon raqamingizni yozing. Restoran siz bilan bog‘lanib, sanani tasdiqlaydi.</span></p>
        <div class="field"><label for="bkn">Ism</label><input id="bkn" type="text" autocomplete="name" value="${esc(bk.name)}"></div>
        <div class="field"><label for="bkp">Telefon</label><input id="bkp" type="tel" inputmode="tel" autocomplete="tel" placeholder="+998 90 123 45 67" value="${esc(bk.phone)}"></div>
        <div class="field"><label for="bko">Izoh (ixtiyoriy)</label><textarea id="bko" rows="3">${esc(bk.note)}</textarea></div>
      ` + nav("Orqaga", "So‘rovni yuborish", bk.name.trim().length > 1 && bk.phone.replace(/\D/g, "").length >= 9);
    } else {
      const us = units(), food = foodTotal();
      const courseLines = (arr, pre) => COURSES.map(([k, name]) => {
        const g = arr.filter(x => x.course === k);
        return g.length ? `${pre}${name}: ${g.map(x => `${x.d.uz} × ${x.q}`).join(", ")}` : null;
      }).filter(Boolean);
      const dishLines = us.length > 1
        ? us.flatMap((u, i) => [`${i + 1}-${tblWord()} (${u.guests} kishi) · ${fmt(u.cost)} so‘m:`].concat(u.items.length ? courseLines(u.items, "  ") : ["  taom yo‘q"]))
        : courseLines(chosenItems(), "").map((l, i, a) => l + ` (${setWord()})`);
      const lines = [
        `NoZi · ${bk.type === "toy" ? "To‘y" : "Banket"} so‘rovi`,
        `${bk.name}, ${bk.phone}`,
        `${bk.date.split("-").reverse().join(".")} · ${bk.time}`,
        `${h.name} · ${bk.guests} kishi · ${tableText()}`,
      ].concat(dishLines).concat([`Jami (${SERVICE_PCT} xizmat bilan): ${fmt(food * (1 + SERVICE))} so‘m${unpriced().length ? " + narxi aniqlanmoqda bo‘lganlar" : ""}`])
        .concat(bk.note.trim() ? [`Izoh: ${bk.note.trim()}`] : []);
      bk.text = lines.join("\n");
      if (!bk.posted) {
        bk.posted = "wait";
        const payload = { name: bk.name.trim(), phone: bk.phone.trim(), date: bk.date, time: bk.time, guests: String(bk.guests),
          hall: h.name, total: fmt(food * (1 + SERVICE)), lang: "uz", text: bk.text, website: "" };
        fetch(BANKET_API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
          .then(r => r.json().catch(() => ({})).then(j => ({ ok: r.ok && j.ok === true, link: j.link || "" })))
          .catch(() => ({ ok: false, link: "" }))
          .then(res => {
            bk.posted = res.ok ? "ok" : "fail"; bk.link = res.link;
            if (bk.sent && body.isConnected && body.querySelector("#bkstatus")) viewBanket(body);
          });
      }
      html += `<div class="done"><h3 class="bk-h">So‘rov tayyor</h3>
        <pre>${esc(lines.join("\n"))}</pre>
        <div id="bkstatus">${bk.posted === "ok"
          ? `<p class="bk-p">So‘rovingiz NoZi’ga yuborildi. Restoran siz bilan bog‘lanib, sanani tasdiqlaydi.</p>${bk.link ? `<div class="pills"><a class="pill gold" href="${esc(bk.link)}" target="_blank" rel="noopener">Telegram orqali tasdiqni olish</a></div>` : ""}`
          : bk.posted === "fail"
            ? `<p class="bk-p">So‘rovni yuborib bo‘lmadi. Matnni nusxalab, restoranga Telegram yoki telefon orqali yuboring.</p><div class="pills"><button class="pill gold" type="button" id="bkcopy">Matnni nusxalash</button></div>`
            : `<p class="bk-p">So‘rov yuborilmoqda…</p>`}</div>
        ${reviewBlock("Xohlasangiz, NoZi haqidagi fikringizni Google xaritada qoldiring.")}
        <div class="bk-nav"><button class="btn" type="button" id="bkedit">Tahrirlash</button><button class="btn primary" type="button" id="bknew">Yangi so‘rov</button></div></div>`;
    }
    const tab = isTab() && bk.step > 0;   // the first step (Tadbir) has no table or dishes to show yet
    body.classList.toggle("split", tab);
    if (tab) html = `<div class="col-l">${html}</div><div class="col-r"><div class="r-top">${view3DHTML(metaText())}</div>
      <div class="r-bot"><div class="d3" id="bkd3"><span class="hint">Taom nomini yoki + ni bosing: 3D ko‘rinishi shu yerda</span><button class="fs" type="button" data-fs="" aria-label="To‘liq ekran" aria-pressed="false"></button></div><p class="vt-meta" id="bkd3c"></p></div></div>`;
    body.innerHTML = html;
    const host = body.querySelector("#vt3");
    if (host) mount3D(host);
    if (tab) showMini(body);
    wireBanket(body);
  }

  // tablet banquet: the lower right pane shows the dish touched last, in 3D
  function showMini(body) {
    const host = body.querySelector("#bkd3"), cap = body.querySelector("#bkd3c");
    if (!host) return;
    const ch = chosenItems();
    const id = bk.lastDish || (ch[0] && ch[0].d.id) || (MENU.find(s => s.id === (bk.sec || MENU[0].id)) || MENU[0]).t[0].id;
    const t = byId[id];
    if (!t) return;
    if (cap) cap.textContent = `${t.uz} · ${t.n == null ? "narxi aniqlanmoqda" : fmt(t.n) + " so‘m"}`;
    mountDish(host, t);
  }
  function pickList() {
    const sec = MENU.find(s => s.id === (bk.sec || MENU[0].id));
    return sec.t.map(t => {
      const q = bk.items[t.id] || 0;
      return `<div class="pk-dish"><div data-show="${t.id}"><b>${esc(t.uz)}</b><span class="pp">${t.n == null ? "narxi aniqlanmoqda" : fmt(t.n) + " so‘m"}${t.o ? " · " + esc(t.o) : ""}${t.s ? " · taxminiy" : ""}${q && tablesNow() > 1 ? ` · ${tableOf(t.id) + 1}-${tblWord()}ga` : ""}</span></div>
        <div class="qty"><button class="qb sm" type="button" data-q="-1" data-id="${t.id}" aria-label="${esc(t.uz)}: kamaytirish" ${q ? "" : "disabled"}>−</button>
        <output id="q-${t.id}">${q}</output>
        <button class="qb sm plus" type="button" data-q="1" data-id="${t.id}" aria-label="${esc(t.uz)}: qo‘shish">+</button></div></div>`;
    }).join("");
  }

  function wireBanket(body) {
    const rerender = () => {
      const c = body.querySelector(".col-l"), y = c ? c.scrollTop : body.scrollTop;
      viewBanket(body);
      const c2 = body.querySelector(".col-l"); if (c2) c2.scrollTop = y; else body.scrollTop = y;
    };
    body.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
      const dir = Number(b.dataset.go);
      if (bk.step === 5 && dir > 0) bk.sent = true;
      else bk.step = Math.max(0, Math.min(5, bk.step + dir));
      if ((bk.step === 3 || bk.step === 1) && dir > 0) bk.view = "dasturxon";
      viewBanket(body); body.scrollTop = 0;
    }));
    body.querySelectorAll("[data-type]").forEach(b => b.addEventListener("click", () => { bk.type = b.dataset.type; bk.shape = null; bk.rest = null; rerender(); }));
    const g = body.querySelector("#bkg");
    if (g) {
      const setG = v => { bk.guests = Math.max(1, Math.min(1500, Math.round(v) || 1)); g.value = bk.guests; bk.shape = null; bk.rows = null; bk.rest = null; bk.tcount = null; syncNext(); };
      body.querySelectorAll("[data-g]").forEach(b => b.addEventListener("click", () => setG(bk.guests + Number(b.dataset.g))));
      g.addEventListener("change", () => setG(Number(g.value)));
      g.addEventListener("input", () => { const v = Number(g.value); if (v >= 1) { bk.guests = Math.min(1500, Math.round(v)); bk.shape = null; bk.rows = null; bk.rest = null; bk.tcount = null; syncNext(); } });
      body.querySelector("#bkd").addEventListener("input", e => { bk.date = e.target.value; syncNext(); });
      body.querySelector("#bkt").addEventListener("input", e => { bk.time = e.target.value || "18:00"; });
    }
    function syncNext() {
      const nx = body.querySelector("[data-go='1']");
      if (nx && bk.step === 0) nx.disabled = !(bk.date && bk.guests >= 1);
    }
    const ch = body.querySelector("#bkch");
    if (ch) ch.addEventListener("click", () => { bk.change = !bk.change; rerender(); });

    play: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9.2 5 2.8-5 2.8z"/></svg>',
    ig: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="0.7" fill="currentColor"/></svg>',
    pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>',
    go: '<svg class="go" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>'
  };
  const hubRow = (act, ic, t, sub, extra = "") =>
    `<button class="hub-row ${extra}" type="button" data-hub="${act}"><span class="ic">${IC[ic]}</span><span><b>${t}</b><small>${sub}</small></span>${IC.go}</button>`;
  function hubHTML() {
    const h = hcfg(), disc = h.discount != null ? h.discount : 1;
    if (hubView === "main") return `
      <div class="hub-top"><img src="nozi-emblem.png" alt=""><b>NoZi</b><small>Restaurant · Samarqand</small></div>
      <p class="hub-hi">Xush kelibsiz! Nima kerak?</p>
      <div class="hub-list">
        ${hubRow("menu", "menu", "Menyu", "Taomlar, narxlar va 3D ko‘rinish")}
        ${hubRow("kod", "star", "Google’da sharh qoldiring", `Sovg‘a kodi oling: ${disc}% chegirma`, "gift")}
        ${hubRow("wifi", "wifi", "Wi-Fi’ga ulanish", "Tarmoq nomi va paroli")}
        ${hubRow("fikr", "chat", "Anonim fikr", "Xodimlarga yozing, ismingiz ko‘rinmaydi")}
        ${hubRow("ads", "play", "Reklamalar va videolar", "Restoranimiz videolari")}
        <a class="hub-row" href="${IG_URL}" target="_blank" rel="noopener"><span class="ic">${IC.ig}</span><span><b>Instagram</b><small>Yangiliklar va suratlar</small></span>${IC.go}</a>
        ${hubRow("aloqa", "pin", "Telefon va manzil", "Qayerdamiz, qanday bog‘lanasiz")}
      </div>
      <div class="hub-bar" style="justify-content:center"><button class="btn" type="button" data-hub="site">Saytni to‘liq ochish</button></div>`;
    const bar = t => `<div class="hub-bar"><h3>${t}</h3><button class="ctl back" type="button" data-hub="home" style="position:static">← Orqaga</button></div>`;
    if (hubView === "kod") {
      const have = hubCode();
      return bar("Sovg‘a kodi") + `<div class="hub-card">
        <div class="hub-step"><i>1</i><p>Google xaritada NoZi haqida sharh yozing. Bir-ikki gap yetadi, yulduzcha qo‘ying.</p></div>
        <a class="btn primary" href="${REVIEW_URL}" target="_blank" rel="noopener" style="justify-content:center">★ Google’da sharh yozish</a>
        <div class="hub-step"><i>2</i><p>Sharh yozib bo‘lgach, shu yerga qaytib kodni oling.</p></div>
        ${have ? `<div class="hub-code" id="hubCode">${esc(have)}</div><button class="btn" type="button" data-hub="copy" style="justify-content:center">Kodni nusxalash</button>` : `<label class="hub-lbl" for="hubMail">Gmail manzilingiz (majburiy, bir Gmail’ga bitta kod beriladi)</label><input type="email" id="hubMail" inputmode="email" autocomplete="email" placeholder="ismingiz@gmail.com" maxlength="80" style="width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--petal);font:16px/1.4 var(--font-ui)"><button class="btn primary" type="button" data-hub="getcode" style="justify-content:center">Sharh yozdim, kod olish</button>`}
        <p class="hub-err" id="hubMsg" role="alert" hidden></p>
        <div class="hub-step"><i>3</i><p>Kodni kassirga yoki ofitsiantga ko‘rsating. Sharhingiz tekshiriladi va hisobdan <b>${disc}% chegirma</b> beriladi.</p></div>
        <p class="muted">Kod bir marta ishlaydi, har bir Gmail’ga faqat bitta kod beriladi. Sharh topilmasa, chegirma berilmaydi.</p></div>`;
    }
    if (hubView === "wifi") {
      const w = h.wifi || {};
      return bar("Wi-Fi") + (w.name ? `<div class="hub-card">
        <div class="hub-kv"><span>Tarmoq nomi</span><b>${esc(w.name)}</b></div>
        ${w.pass ? `<div class="hub-kv"><span>Parol</span><b id="hubPass">${esc(w.pass)}</b></div><button class="btn" type="button" data-hub="copypass" style="justify-content:center">Parolni nusxalash</button>` : `<p class="muted">Bu tarmoqqa parolsiz ulaniladi.</p>`}
        <p class="hub-ok" id="hubMsg" role="status" hidden></p></div>`
        : `<div class="hub-card"><p>Wi-Fi nomi va paroli tez orada shu yerda ko‘rinadi. Hozircha ofitsiantdan so‘rang.</p></div>`);
    }
    if (hubView === "fikr") return bar("Anonim fikr") + `<form class="hub-card" id="hubForm" autocomplete="off">
        <p>Xizmat, taom yoki muhit haqida yozing. Ismingiz va telefoningiz so‘ralmaydi, fikr to‘g‘ridan-to‘g‘ri xodimlarga boradi.</p>
        <textarea id="hubTxt" maxlength="1500" placeholder="Fikringizni yozing…" aria-label="Fikringiz"></textarea>
        <input class="hp" type="text" id="hubHp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="hub-err" id="hubMsg" role="alert" hidden></p>
        <button class="btn primary" type="submit" style="justify-content:center">Yuborish</button></form>`;
    if (hubView === "fikrok") return bar("Rahmat!") + `<div class="hub-card"><p>Fikringiz xodimlarga yuborildi. Bizga yordam berganingiz uchun rahmat.</p></div>`;
    if (hubView === "aloqa") {
      const addr = h.address || "Termiz yo‘li, Samarqand", tel = String(h.phone || "").trim();
      return bar("Telefon va manzil") + `<div class="hub-card">
        <div class="hub-kv"><span>Manzil</span><b>${esc(addr)}</b></div>
        ${h.hours ? `<div class="hub-kv"><span>Ish vaqti</span><b>${esc(h.hours)}</b></div>` : ""}
        ${tel ? `<div class="hub-kv"><span>Telefon</span><b>${esc(tel)}</b></div><a class="btn primary" href="tel:${esc(tel.replace(/[^\d+]/g, ""))}" style="justify-content:center">Qo‘ng‘iroq qilish</a>` : `<p class="muted">Telefon raqami tez orada qo‘shiladi.</p>`}
        <a class="btn" href="${MAP_URL}" target="_blank" rel="noopener" style="justify-content:center">Xaritada ochish</a></div>`;
    }
    return "";
  }
  function hubCode() { try { return localStorage.getItem("nozi_kod") || ""; } catch (e) { return ""; } }
  function drawHub() { hubEl.innerHTML = `<div class="hub-in">${hubHTML()}</div>`; hubEl.scrollTop = 0; }
  function openHub() {
    hubMode = true; hubView = "main"; drawHub();
    hubEl.hidden = false; void hubEl.offsetWidth; hubEl.classList.add("on");
  }
  function closeHub(done) {
    hubEl.classList.remove("on");
    setTimeout(() => { hubEl.hidden = true; if (done) done(); }, 460);
  }
  const hubMsg = (t, bad) => { const m = hubEl.querySelector("#hubMsg"); if (!m) return; m.hidden = !t; m.className = bad ? "hub-err" : "hub-ok"; m.textContent = t || ""; };
  hubEl.addEventListener("click", e => {
    const b = e.target.closest("[data-hub]"); if (!b) return;
    const a = b.dataset.hub;
    if (a === "menu") return closeHub(() => enter(0, "menyu"));
    if (a === "ads") return closeHub(() => enter(1, "reklamalar"));
    if (a === "site") { hubMode = false; return closeHub(); }
    if (a === "home") { hubView = "main"; return drawHub(); }
    if (["kod", "wifi", "fikr", "aloqa"].includes(a)) { hubView = a; return drawHub(); }
    if (a === "copy" || a === "copypass") {
      const t = (hubEl.querySelector(a === "copy" ? "#hubCode" : "#hubPass") || {}).textContent || "";
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => say("Nusxalandi"), () => say("Nusxalab bo‘lmadi, qo‘lda yozib oling"));
      return;
    }
    if (a === "getcode") {
      const mail = ((hubEl.querySelector("#hubMail") || {}).value || "").trim().toLowerCase();
      if (!/^[a-z0-9._+-]{3,64}@gmail\.com$/.test(mail)) return hubMsg("Gmail manzilini to‘g‘ri yozing, masalan ismingiz@gmail.com", true);
      if (hubBusy) return; hubBusy = true; b.disabled = true; b.textContent = "Kod tayyorlanmoqda…";
      fetch("/api/kod", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: mail }) }).then(r => r.json().catch(() => ({})).then(j => ({ r, j }))).then(({ r, j }) => {
        hubBusy = false;
        if (r.ok && j.ok) { try { localStorage.setItem("nozi_kod", j.code); } catch (e) {} drawHub(); }
        else { b.disabled = false; b.textContent = "Sharh yozdim, kod olish"; hubMsg(j.error || "Kod olib bo‘lmadi. Birozdan keyin urinib ko‘ring.", true); }
      }).catch(() => { hubBusy = false; b.disabled = false; b.textContent = "Sharh yozdim, kod olish"; hubMsg("Internet yo‘q yoki server javob bermadi.", true); });
    }
  });
  hubEl.addEventListener("submit", e => {
    if (e.target.id !== "hubForm") return;
    e.preventDefault();
    const text = hubEl.querySelector("#hubTxt").value.trim(), hp = hubEl.querySelector("#hubHp").value;
    if (text.length < 5) return hubMsg("Fikr juda qisqa. Bir-ikki gap yozing.", true);
    if (hubBusy) return; hubBusy = true;
    const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Yuborilmoqda…";
    fetch("/api/fikr", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, website: hp }) })
      .then(r => r.json().catch(() => ({})).then(j => ({ r, j }))).then(({ r, j }) => {
        hubBusy = false;
        if (r.ok && j.ok) { hubView = "fikrok"; drawHub(); }
        else { btn.disabled = false; btn.textContent = "Yuborish"; hubMsg(j.error || "Yuborib bo‘lmadi. Birozdan keyin urinib ko‘ring.", true); }
      }).catch(() => { hubBusy = false; btn.disabled = false; btn.textContent = "Yuborish"; hubMsg("Internet yo‘q yoki server javob bermadi.", true); });
  });

  // ---------- loop ----------
  function loop(now) {
    if (!window.__hold) render(now);
    requestAnimationFrame(loop);
  }

  // test hook: render a given moment of the intro, or of the resting wind
  window.__seek = (t, windSec) => new Promise(res => {
    window.__hold = true; gate.hidden = true; film.pause();
    const end = film.duration || 10;
    const fake = performance.now();
    if (t >= end) {
      stage.classList.add("rest"); mode = "rest"; after = { t0: t, at: fake }; windOn = fake - (windSec || 3) * 1000;
      toEnd(() => { render(fake); res(); });
      return;
    }
    mode = "intro"; after = null; stage.classList.remove("rest"); flower.hidden = true; seek(t);
    film.addEventListener("seeked", () => { render(fake); res(); }, { once: true });
  });

  addEventListener("resize", layout);
  layout(); applyMode();
  // a table card's QR code or NFC tag opens straight into a section: …#menyu, #banket, #reklamalar
  const deep = (location.hash || "").replace("#", "");
  if (TITLES[deep]) {
    film.muted = true;
    const openDeep = () => { if (deep === "qr") openHub(); else enter(["menyu", "reklamalar", "banket"].indexOf(deep), deep); };
    let settled = false, logoDone = deep === "reklamalar" || deep === "kartochka" || reduce;   // adverts already begin with the logo
    const tryOpen = () => { if (settled && logoDone) openDeep(); };
    const go = () => toEnd(() => { rest(UI_END + 0.1); settled = true; tryOpen(); });
    if (film.readyState >= 1) go(); else film.addEventListener("loadedmetadata", go, { once: true });
    if (!logoDone) {
      // the guest scanned a table card: the NoZi logo film first, then the section
      const li = $("logoIntro"), lf = $("logoFilm");
      li.hidden = false;
      const finish = () => {
        if (logoDone) return;
        logoDone = true;
        li.classList.add("out");
        setTimeout(() => { lf.pause(); li.hidden = true; }, 750);
        tryOpen();
      };
      $("liSkip").textContent = deep === "banket" ? "Banketga o‘tish" : deep === "qr" ? "Davom etish" : "Menyuga o‘tish";
      $("liSkip").addEventListener("click", finish);
      $("liSound").addEventListener("click", () => {
        lf.muted = !lf.muted;
        $("liSound").setAttribute("aria-pressed", String(!lf.muted));
        $("liSound").textContent = lf.muted ? "Ovozni yoqish" : "Ovozni o‘chirish";
        if (lf.paused) lf.play().catch(() => {});
      });
      lf.addEventListener("ended", finish);
      lf.addEventListener("error", finish);
      const p = lf.play();
      // if the phone refuses to play, go straight to the menu rather than keep the guest waiting
      if (p && p.catch) p.catch(finish);
      setTimeout(finish, 15000);
    }
  } else if (reduce) { skipBtn.click(); } else { film.muted = true; start(); }
  requestAnimationFrame(loop);
})();
</script>
