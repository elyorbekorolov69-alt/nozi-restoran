<!doctype html><meta charset=utf-8><body style="margin:0;background:#2a2622">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<canvas id=c width=420 height=420></canvas>
<script type=module>
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});r.setSize(420,420,false);r.toneMapping=THREE.ACESFilmicToneMapping;
const pm=new THREE.PMREMGenerator(r);const env=pm.fromScene(new RoomEnvironment(),0.04).texture;
const L=new GLTFLoader();const d=new DRACOLoader();d.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/');L.setDRACOLoader(d);
window.shot=async name=>{const g=await L.loadAsync('/taom/'+name+'.glb');const sc=new THREE.Scene();sc.background=new THREE.Color(0x2a2622);sc.environment=env;sc.add(g.scene);
 const bb=new THREE.Box3().setFromObject(g.scene),sz=bb.getSize(new THREE.Vector3()),c=bb.getCenter(new THREE.Vector3());
 let tris=0,mats=new Set,tex=[];g.scene.traverse(o=>{if(o.isMesh){tris+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3;mats.add(o.material);for(const k in o.material){const t=o.material[k];if(t&&t.isTexture&&t.image)tex.push(t.image.width+'x'+t.image.height)}}});
 const R=Math.max(sz.x,sz.z,sz.y)*1.15;const cam=new THREE.PerspectiveCamera(32,1,0.01,100);cam.position.set(c.x,c.y+R*1.1,c.z+R*1.9);cam.lookAt(c);
 r.render(sc,cam);return {size:[sz.x,sz.y,sz.z].map(v=>+v.toFixed(3)),tris:Math.round(tris),mats:mats.size,tex:[...new Set(tex)].join(','),img:r.domElement.toDataURL('image/jpeg',.85)}};
window.ready=true;
</script>
