<style>
input, select, textarea, button { box-sizing: border-box; }
table { font-size: inherit; }
/* Layout: the Kadupul film fills the screen and keeps swaying in the wind; three different petals carry the sections; a window grows out of its petal */
:root {
  --night: #050812;      /* page ground behind the film */
  --ink: #1a1f36;        /* text written on a white petal */
  --petal: #f6f7fb;      /* petal white */
  --gold: #d6aa52;       /* NoZi gold: wordmark, focus */
  --gold-soft: #f0d39a;  /* gold on dark, small text */
  --mist: rgba(220, 228, 255, 0.74); /* quiet UI text on the night */
  --glass: rgba(8, 12, 26, 0.84);    /* section window */
  --glass-solid: rgba(10, 14, 30, 0.97); /* sticky bars inside a window */
  --line: rgba(240, 211, 154, 0.16);  /* hairlines */
  --line2: rgba(220, 228, 255, 0.22); /* control borders */
  --font-display: "Italiana", "Cormorant Garamond", "Times New Roman", serif;
  --font-menu: "Cormorant Garamond", "Garamond", "Times New Roman", serif;
  --font-ui: "Jost", "Futura", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--night);
  color: var(--petal);
  font-family: var(--font-ui);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* ---------- the film and the living background ---------- */
.stage { position: fixed; inset: 0; overflow: hidden; background: var(--night); transition: transform 0.7s cubic-bezier(.3, .7, .2, 1); }
.stage::after { content: ""; position: absolute; inset: 0; background: var(--night); opacity: 0; transition: opacity 0.55s ease; pointer-events: none; }
.stage .scene { position: absolute; inset: 0; transform-origin: 50% 46%; }
.stage.rest .scene { animation: drift 22s ease-in-out infinite alternate; }
.stage video, #flower { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage video { object-fit: cover; object-position: 50% 50%; }
@keyframes drift {
  0%   { transform: scale(1) translateX(0); }
  50%  { transform: scale(1.035) translateX(-0.5%); }
  100% { transform: scale(1.05) translateX(0.5%); }
}
/* the flower rocks on its stem; only a transform, so the phone's graphics chip does the work */
.stage.rest #flower { animation: sway 4.8s ease-in-out infinite alternate; will-change: transform; }
/* after the film: a looping clip of the last frame with the whole meadow moving in the wind */
#windFilm { opacity: 0; transition: opacity 0.8s ease; }
#windFilm.on { opacity: 1; }
#windIn, #swirlFilm { opacity: 0; transition: opacity 0.3s ease; }
#windIn.on, #swirlFilm.on { opacity: 1; }
#flower { transition: opacity 0.8s ease; }
#flower.off { opacity: 0; }
.stage.still .scene { background: var(--night) url(kadupul-last.jpg) 50% 50% / cover no-repeat; }
.stage.still #film { visibility: hidden; }
@keyframes sway {
  0%   { transform: rotate(-0.7deg) skewX(0.4deg); }
  45%  { transform: rotate(0.2deg) skewX(-0.1deg) translateY(-1px); }
  100% { transform: rotate(0.75deg) skewX(-0.45deg); }
}
.stage.zoom { transform: scale(1.06); }
.stage.zoom::after { opacity: 0.5; }
.shade {
  position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(to bottom, rgba(5, 8, 18, 0.35) 0%, rgba(5, 8, 18, 0) 22%, rgba(5, 8, 18, 0) 50%, rgba(5, 8, 18, 0.55) 100%);
  transition: opacity 1.4s ease;
}
.stage.rest .shade { opacity: 1; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

.brand {
  position: fixed; z-index: 3; left: 0; right: 0;
  top: calc(env(safe-area-inset-top, 0px) + 18px);
  display: grid; justify-items: center; gap: 2px;
  pointer-events: none;
  opacity: 0; transform: translateY(-6px);
  transition: opacity 1.2s ease, transform 1.2s ease;
}
.brand.on { opacity: 1; transform: none; }
.brand b {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(30px, 8vw, 46px); letter-spacing: 0.22em; padding-left: 0.22em;
  color: var(--gold-soft);
  text-shadow: 0 0 24px rgba(214, 170, 82, 0.35), 0 2px 12px rgba(0, 0, 0, 0.6);
}
.brand-logo { width: clamp(34px, 9vw, 48px); height: auto; margin: 2px 0 1px; filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.6)); }
.brand small {
  font-size: 10.5px; letter-spacing: 0.32em; padding-left: 0.32em; text-transform: uppercase;
  color: var(--mist); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
}

/* ---------- a petal is the button; its name is written on the petal and tilts with it ---------- */
.petal {
  position: fixed; z-index: 4; left: 0; top: 0;
  padding: 0; border: 0; background: none; cursor: pointer;
  transform: translate(-50%, -50%);
  border-radius: 40%;
  transition: opacity 0.45s ease;
}
.petal.gone { opacity: 0; pointer-events: none; }
.petal.chosen .in { transform: rotate(var(--rot, 0deg)) scale(1.25); transition: transform 0.3s ease; }
.petal .in {
  position: relative; display: block;
  width: var(--pw, 120px); aspect-ratio: var(--ar, 100 / 130);
  transform: rotate(var(--rot, 0deg)) scale(var(--s, 1)); transform-origin: 50% 50%;
}
.petal svg {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%; overflow: visible;
  filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 14px rgba(255, 246, 236, 0.28));
  transition: filter 0.25s ease;
}
.petal .name {
  position: absolute; left: 2%; right: 2%; top: 36%; white-space: nowrap; letter-spacing: 0;
  text-align: center; color: var(--ink);
  font: 500 clamp(12.5px, 3.5vw, 15.5px)/1.1 var(--font-ui); letter-spacing: 0.02em;
  text-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
}
.petal:hover svg, .petal:focus-visible svg, .petal.chosen svg {
  filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 22px rgba(255, 236, 220, 0.75));
}
.petal:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; }
.petal:active .in { transform: rotate(var(--rot, 0deg)) scale(0.95); }

.ctl {
  position: fixed; z-index: 5;
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid rgba(220, 228, 255, 0.24); border-radius: 999px;
  background: rgba(5, 8, 18, 0.42); color: var(--mist);
  font: 400 12px/1 var(--font-ui); letter-spacing: 0.06em;
  padding: 9px 14px; cursor: pointer; text-decoration: none;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.ctl:hover { color: var(--petal); border-color: rgba(240, 211, 154, 0.55); }
.ctl:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.ctl svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#skip, #replay { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
#sound { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
#sound[aria-pressed="true"] { color: var(--gold-soft); border-color: rgba(240, 211, 154, 0.55); }

.gate {
  position: fixed; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: grid; justify-items: center; gap: 12px;
  border: 0; background: none; color: var(--petal); cursor: pointer;
  font: 400 14px/1.2 var(--font-ui); letter-spacing: 0.12em; text-transform: uppercase;
}
.gate i {
  width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid rgba(240, 211, 154, 0.6); background: rgba(5, 8, 18, 0.45);
  box-shadow: 0 0 28px rgba(255, 240, 210, 0.2);
}
.gate i::before { content: ""; border-style: solid; border-width: 11px 0 11px 18px; border-color: transparent transparent transparent var(--gold-soft); margin-left: 5px; }
.gate:focus-visible i { outline: 2px solid var(--gold); outline-offset: 4px; }

/* ---------- a window grows out of its petal ---------- */
.win {
  position: fixed; z-index: 8; left: 50%; top: 50%;
  width: min(780px, calc(100% - 32px));
  height: min(900px, calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));
  transform: translate(-50%, -50%);
  background: rgba(9, 13, 28, 0.94); border: 1px solid var(--line2); border-radius: 22px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
  display: flex; flex-direction: column; overflow: hidden;
  transition: transform 0.5s cubic-bezier(.2, .8, .2, 1), opacity 0.35s ease, border-radius 0.5s ease;
}
.win.closed { transform: translate(-50%, -50%) scale(0.1); opacity: 0; border-radius: 48%; }
.win.snap { transition: none; }
.win .bloom {
  position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background: linear-gradient(160deg, #ffffff, #f4eef3);
  opacity: 0; transition: opacity 0.4s ease 0.12s;
}
.win.white .bloom { opacity: 1; transition: opacity 0.15s ease; }
.win-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 14px 12px 22px; border-bottom: 1px solid var(--line); }
.win-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 7.5vw, 40px); letter-spacing: 0.08em; color: var(--gold-soft); }
.win-head .back { position: static; flex: none; z-index: auto; }
.win-body { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 16px 22px 28px; }
.win-body h3.sub { font-family: var(--font-display); font-weight: 400; font-size: 24px; color: var(--gold-soft); margin: 26px 0 0; }

.win-body input[type="search"], .win-body input[type="text"], .win-body input[type="tel"], .win-body input[type="password"],
.win-body input[type="number"], .win-body input[type="date"], .win-body input[type="time"], .win-body input[type="file"], .win-body textarea, .win-body select {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line2);
  background: rgba(255, 255, 255, 0.06); color: var(--petal); font: 400 16px/1.3 var(--font-ui); color-scheme: dark;
}
.win-body select { width: auto; padding: 8px 10px; font-size: 14px; }
.win-body input:focus-visible, .win-body textarea:focus-visible, .win-body select:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line2);
  background: transparent; color: var(--mist); font: 400 13px/1 var(--font-ui); cursor: pointer; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--gold-soft); color: var(--ink); border-color: var(--gold-soft); }
.chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
@media (pointer: coarse) { .chip { min-height: 40px; padding: 0 15px; display: inline-flex; align-items: center; } .ctl { min-height: 40px; } }
.tag {
  display: inline-block; font: 500 10px/1 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--gold-soft); border: 1px solid rgba(240, 211, 154, 0.45); border-radius: 999px; padding: 3px 6px; white-space: nowrap;
}
.note { color: var(--mist); font-size: 12.5px; line-height: 1.5; margin: 16px 0 0; }
.empty { color: var(--mist); padding: 24px 0; text-align: center; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px;
  border: 1px solid var(--line2); color: var(--petal); text-decoration: none; font: 500 13.5px/1 var(--font-ui);
}
.pill.gold { background: var(--gold-soft); color: var(--ink); border-color: var(--gold-soft); }
.pills.ig { margin-top: 14px; }
.pills.ig + .note { margin-top: 8px; }
.pill:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* menu: an old-fashioned card with dotted leaders */
.mn-head { display: grid; gap: 12px; }
.mn-sec h3 { font-family: var(--font-menu); font-weight: 600; font-style: italic; font-size: 30px; color: var(--gold-soft); margin: 28px 0 2px; display: flex; align-items: baseline; gap: 10px; letter-spacing: 0.01em; }
.mn-sec h3 small { font: 400 11.5px/1 var(--font-ui); font-style: normal; color: var(--mist); letter-spacing: 0.08em; }
.dish { padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
.dish .ln { display: flex; align-items: baseline; gap: 8px; }
.dish b { font-family: var(--font-menu); font-weight: 600; font-size: 21px; line-height: 1.15; letter-spacing: 0.005em; min-width: 0; }
.dish .lead { flex: 1; min-width: 16px; border-bottom: 1.5px dotted rgba(240, 211, 154, 0.38); transform: translateY(-5px); }
.dish .p { font-family: var(--font-menu); font-weight: 600; font-size: 20px; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; color: var(--gold-soft); }
.dish .p small { font: 400 11px/1 var(--font-ui); color: var(--mist); margin-left: 3px; }
.dish .sub2 { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 3px; color: var(--mist); font-size: 12.5px; }
.dish .o { color: var(--gold-soft); }
.dish .k { color: var(--mist); font-size: 13px; line-height: 1.45; margin: 4px 0 0; max-width: 60ch; }
.dish.has-pic { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: start; }
.dish .dm { min-width: 0; }
.pic { position: relative; width: 96px; height: 96px; padding: 0; border: 1px solid var(--line2); border-radius: 14px; overflow: hidden; cursor: pointer; background: #000; }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pic video { width: 100%; height: 100%; object-fit: cover; display: block; }
.b3d { position: absolute; left: 6px; bottom: 6px; padding: 3px 7px; border-radius: 999px; background: var(--gold-soft); color: var(--ink); font: 600 10.5px/1 var(--font-ui); letter-spacing: 0.06em; }
.see3d { margin-top: 8px; padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(240, 211, 154, 0.5); background: transparent; color: var(--gold-soft); font: 500 12.5px/1 var(--font-ui); cursor: pointer; }
.pic:focus-visible, .see3d:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
/* a dish photographed from above on a black plate with a gold rim, framed as a medallion */
.dish.has-plate { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: center; }
.plate {
  position: relative; display: block; width: 92px; height: 92px; border-radius: 50%; overflow: hidden; background: #000;
  box-shadow: 0 0 0 1px rgba(240, 211, 154, 0.42), 0 0 0 5px rgba(240, 211, 154, 0.06), 0 12px 24px rgba(0, 0, 0, 0.55);
}
.plate img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.03); }
.plate::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(70% 70% at 35% 25%, rgba(255, 244, 220, 0.1), transparent 60%); pointer-events: none; }
.sheet { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; background: #0a0e1e; transform: translateY(24px); opacity: 0; transition: opacity 0.25s ease, transform 0.3s ease; }
.sheet.on { transform: none; opacity: 1; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 14px 12px 22px; border-bottom: 1px solid var(--line); }
.sheet-head h3 { margin: 0; font-family: var(--font-menu); font-style: italic; font-weight: 600; font-size: 26px; color: var(--gold-soft); min-width: 0; }
.sheet-head .back { position: static; flex: none; z-index: auto; }
.sheet-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 22px 26px; }
.d3 { position: relative; height: min(46vh, 380px); border-radius: 16px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #1b2136, #0b0f1d 75%); }
.d3 canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.m3ph { display: grid; place-items: center; width: 100%; height: 100%; background: radial-gradient(ellipse at 50% 40%, #1b2136, #0b0f1d 75%); color: var(--gold, #e9c98a); font-weight: 700; letter-spacing: .08em; }
.d3 .glb-poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; pointer-events: none; transition: opacity .4s; }
.d3 .glb-poster.off { opacity: 0; }
.d3 .glb-state { position: absolute; left: 0; right: 0; top: 10px; z-index: 2; text-align: center; color: #fff; font-size: 12px; text-shadow: 0 1px 3px #000; pointer-events: none; }
.d3 .fs { z-index: 3; }
.d3 .hint { position: absolute; left: 10px; bottom: 8px; color: var(--mist); font-size: 11.5px; pointer-events: none; }
.d-info { margin-top: 14px; }
.d-info .ln { display: flex; align-items: baseline; gap: 8px; }
.d-info b { font-family: var(--font-menu); font-weight: 600; font-size: 22px; }
.d-info .lead { flex: 1; min-width: 16px; border-bottom: 1.5px dotted rgba(240, 211, 154, 0.38); transform: translateY(-5px); }
.d-info .p { font-family: var(--font-menu); font-weight: 600; font-size: 21px; color: var(--gold-soft); white-space: nowrap; }
.d-info .p small { font: 400 11px/1 var(--font-ui); color: var(--mist); margin-left: 3px; }
.d-info .sub2 { display: flex; gap: 10px; color: var(--mist); font-size: 12.5px; margin-top: 3px; }
.d-info .o { color: var(--gold-soft); }
.d-info .k { color: var(--mist); font-size: 13.5px; line-height: 1.5; margin: 6px 0 0; }
.d-vid { position: relative; width: min(100%, calc(56vh * 9 / 16)); aspect-ratio: 9 / 16; margin: 0 auto; border-radius: 16px; overflow: hidden; background: #000; }
.d-vid .fs { top: 8px; bottom: auto; }
.d-vid video { width: 100%; height: 100%; object-fit: cover; display: block; }
.sec-ph { margin: 10px 0 4px; }
.sec-ph img { width: 100%; max-width: 100%; height: clamp(150px, 42vw, 240px); object-fit: cover; border-radius: 14px; display: block; }
.sec-ph figcaption { color: var(--mist); font-size: 12px; margin-top: 6px; }
.pbox { position: fixed; inset: 0; z-index: 100000; background: rgba(0,0,0,.94); display: flex; align-items: center; justify-content: center; touch-action: pan-y; }
.pbox img { max-width: 100vw; max-height: 100dvh; object-fit: contain; user-select: none; -webkit-user-drag: none; }
.pbox button { position: absolute; border: 0; border-radius: 12px; background: rgba(255,255,255,.16); color: #fff; font-size: 26px; width: 48px; height: 48px; cursor: pointer; }
.pbox .px { top: max(14px, env(safe-area-inset-top)); right: 14px; }
.pbox .pp { left: 10px; top: 50%; margin-top: -24px; } .pbox .pn { right: 10px; top: 50%; margin-top: -24px; }
.pbox .pc { position: absolute; bottom: max(16px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; }
.d-photos img { cursor: zoom-in; }
.d-photos { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 46%); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.d-photos img { width: 100%; max-width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; display: block; }

/* 3D hall viewer */
.vt3 canvas.hallc { pointer-events: none; cursor: default; }
/* adverts */
.fs {
  position: absolute; right: 8px; bottom: 8px; z-index: 3; width: 40px; height: 40px; padding: 0; display: grid; place-items: center;
  border: 0; border-radius: 10px; background: rgba(5, 8, 18, 0.45); color: #fff; cursor: pointer;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.fs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.fs:active { color: var(--gold-soft); }
.fs:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.fsx { position: fixed !important; inset: 0; z-index: 99999; width: 100vw !important; height: 100vh !important; height: 100dvh !important;
  margin: 0 !important; max-width: none !important; aspect-ratio: auto !important; border: 0 !important; border-radius: 0 !important; background: #000; }
.fsx video { object-fit: contain !important; }
.fsx.d3, .fsx.vt3 { background: radial-gradient(ellipse at 50% 40%, #1b2136, #0b0f1d 75%) !important; }
.fsx .hint { display: none; }
@media (orientation: portrait) {
  .fsx.ad-wide { top: 0 !important; left: 100% !important; right: auto !important; bottom: auto !important; inset: auto; transform-origin: 0 0; transform: rotate(90deg);
    width: 100vh !important; width: 100dvh !important; height: 100vw !important; }
}
.fsx .fs { right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); }
.fsx .ad-sound { left: 14px; bottom: max(14px, env(safe-area-inset-bottom)); }
.fsx .courses { top: max(10px, env(safe-area-inset-top)); }

/* banquet */

<script>
/* NoZi banquet tables in 3D: a small WebGL renderer with orbit controls.
   Everything is built from simple solids (lathe shapes and boxes) until real models arrive.
   All pieces are baked into a few large buffers so a phone draws a whole hall in two or three calls. */
function Table3D(canvas, opts) {
  "use strict";
  const PI = Math.PI;
  const gl = canvas.getContext("webgl", { antialias: true, alpha: true, premultipliedAlpha: false });
  if (!gl) return null;

  // ---------- shaders: colour and material travel with each vertex ----------
  const VS = `attribute vec3 aP; attribute vec3 aN; attribute vec3 aL; attribute vec4 aC; attribute vec4 aM;
    uniform mat4 uPV, uLPV;
    varying vec3 vN; varying vec3 vW; varying vec3 vL; varying vec4 vC; varying vec4 vM; varying vec4 vSh;
    void main(){ vW = aP; vN = aN; vL = aL; vC = aC; vM = aM; vSh = uLPV * vec4(aP, 1.0); gl_Position = uPV * vec4(aP, 1.0); }`;
  // soft sun shadows: depth of the table seen from the sun, packed into RGBA, read back with a small blur
  const DVS = `attribute vec3 aP; attribute vec4 aM; uniform mat4 uLPV; varying vec4 vM; void main(){ vM = aM; gl_Position = uLPV * vec4(aP, 1.0); }`;
  const DFS = `precision highp float; varying vec4 vM;
    void main(){
      float uP = floor(vM.w * 255.0 / 10.0 + 0.5);
      if ((uP > 6.5 && uP < 8.5) || (uP > 8.5 && uP < 10.5) || (uP > 10.5 && uP < 12.5) || (uP > 15.5 && uP < 17.5)) discard;
      vec4 e = fract(gl_FragCoord.z * vec4(1.0, 255.0, 65025.0, 16581375.0)); e -= e.yzww * vec4(1.0 / 255.0, 1.0 / 255.0, 1.0 / 255.0, 0.0);
      gl_FragColor = e;
    }`;
  // material: x shine, y sharpness/128, z glow, w surface*15/255
  // surfaces: 1 plate with a dotted rim, 2 breaded crust, 3 ribbed glass, 4 velvet, 5 clustered blossoms, 6 streaked plate,
  //           7 planked floor, 8 plaster wall, 9 sky, 10 soft shadow, 11 marble tile, 12 lit window (7, 8, 11, 12 are drawn from the inside only)
  const FS = `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif
    varying vec3 vN; varying vec3 vW; varying vec3 vL; varying vec4 vC; varying vec4 vM; varying vec4 vSh;
    uniform sampler2D uSM; uniform float uShOn, uShB;
    uniform vec3 uEye, uLP, uLC, uTint, uSk1, uSk2;
    uniform float uAm, uSun, uTM, uAO; uniform sampler2D uTex; uniform sampler2D uA0, uA1, uA2;
    float hh(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float unp(vec4 c){ return dot(c, vec4(1.0, 1.0 / 255.0, 1.0 / 65025.0, 1.0 / 16581375.0)); }
    float shadowAt(vec3 N, vec3 L){
      if (uShOn < 0.5) return 1.0;
      vec3 p = vSh.xyz / vSh.w * 0.5 + 0.5;
      if (p.x < 0.0 || p.x > 1.0 || p.y < 0.0 || p.y > 1.0 || p.z > 1.0) return 1.0;
      float nl = dot(N, L); if (nl < 0.14) return 1.0;
      float b = (0.00022 + 0.0005 * (1.0 - nl)) * uShB, s = 0.0, ts = 1.6 / 2048.0;
      for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++) { float d = unp(texture2D(uSM, p.xy + vec2(float(i), float(j)) * ts)); s += (p.z - b > d) ? 0.0 : 1.0; }
      return s / 9.0;
    }
    float ell(vec2 p, vec2 c, vec2 ab, float an){ vec2 d = p - c; float ca = cos(an), sa = sin(an); return step(length(vec2((d.x * ca + d.y * sa) / ab.x, (-d.x * sa + d.y * ca) / ab.y)), 1.0); }
    float rng(vec2 p, vec2 c, float r, float w){ return step(abs(length(p - c) - r), w); }
    float nz(vec3 p){
      vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      float o = i.z * 17.0, o2 = o + 17.0;
      float a = mix(mix(hh(i.xy + o), hh(i.xy + vec2(1.0, 0.0) + o), f.x), mix(hh(i.xy + vec2(0.0, 1.0) + o), hh(i.xy + vec2(1.0, 1.0) + o), f.x), f.y);
      float b = mix(mix(hh(i.xy + o2), hh(i.xy + vec2(1.0, 0.0) + o2), f.x), mix(hh(i.xy + vec2(0.0, 1.0) + o2), hh(i.xy + vec2(1.0, 1.0) + o2), f.x), f.y);
      return mix(a, b, f.z);
    }
    void main(){
      vec3 N = normalize(vN); vec3 V = normalize(uEye - vW);
      vec3 base = vC.rgb; float alpha = vC.a;
      float uS = vM.x, uSh = vM.y * 128.0 + 1.0, uE = vM.z, uP = floor(vM.w * 255.0 / 10.0 + 0.5);
      bool inner = (uP > 6.5 && uP < 8.5) || (uP > 10.5 && uP < 12.5) || (uP > 15.5 && uP < 17.5);
      if (inner && dot(N, V) < 0.0) discard;
      if (uP > 8.5 && uP < 9.5) {
        vec3 dr = normalize(vW - uEye);
        float t = clamp(dr.y, 0.0, 1.0);
        vec3 sk = dr.y < 0.0 ? uSk1 * 0.45 : mix(uSk1, uSk2, pow(t, 0.55));
        gl_FragColor = vec4(sk, 1.0); return;
      }
      if (uP > 9.5 && uP < 10.5) {
        float r = clamp(length(vL.xz) * 2.0, 0.0, 1.0);
        gl_FragColor = vec4(0.02, 0.015, 0.03, alpha * pow(1.0 - r, 2.4)); return;
      }
      if (uP > 11.5 && uP < 12.5) {
        float u = vW.x + vW.z, g = clamp(vL.y + 0.5, 0.0, 1.0);
        vec3 gl2 = mix(uSk1 * 1.3 + 0.12, uSk2 * 1.6 + 0.05, g);
        float bar = max(step(fract(u * 0.8), 0.045), step(fract(vW.y * 0.8 + 0.2), 0.045));
        float edge = max(step(0.465, abs(vL.x)), step(0.475, abs(vL.y)));
        gl_FragColor = vec4(mix(gl2, vec3(0.1, 0.085, 0.07), max(bar, edge)), 1.0); return;
      }
      if (dot(N, V) < 0.0) N = -N;
      if (uP > 0.5 && uP < 1.5) {
        float r = length(vL.xz) * 2.0, ang = atan(vL.z, vL.x) / 6.2831853 + 0.5;
        float ring = r * 20.0, ri = floor(ring), n = floor(6.0 + ri * 6.0), ai = floor(ang * n);
        float d = length(vec2(fract(ring), fract(ang * n)) - 0.5);
        float on = step(d, 0.34) * step(hh(vec2(ri, ai)), smoothstep(0.4, 0.97, r));
        vec3 dc = mix(vec3(0.05, 0.14, 0.13), vec3(0.64, 0.54, 0.34), step(0.72, hh(vec2(ai + 3.0, ri))));
        base = mix(mix(vec3(0.95, 0.93, 0.85), vec3(0.6, 0.66, 0.57), smoothstep(0.25, 0.62, r)), dc, on);
      } else if (uP > 1.5 && uP < 2.5) {
        float cr = nz(vL * 45.0), fl = nz(vL * 170.0);
        base *= 0.6 + 0.45 * cr + 0.25 * fl;
        base = mix(base, vec3(0.55, 0.36, 0.16), smoothstep(0.72, 0.9, fl) * 0.5);
      } else if (uP > 2.5 && uP < 3.5) {
        alpha = clamp(alpha + 0.25 * pow(abs(sin(atan(vL.z, vL.x) * 22.0)), 6.0), 0.0, 1.0);
      } else if (uP > 3.5 && uP < 4.5) {
        base *= 0.7 + 0.6 * (1.0 - max(dot(N, V), 0.0)) + 0.2 * (nz(vW * 9.0) - 0.5);
      } else if (uP > 4.5 && uP < 5.5) {
        base *= 0.78 + 0.34 * nz(vL * 16.0);
      } else if (uP > 5.5 && uP < 6.5) {
        float r = length(vL.xz) * 2.0, ang = atan(vL.z, vL.x);
        float st = pow(abs(sin(ang * 70.0 + nz(vL * 30.0) * 3.0)), 10.0) * smoothstep(0.3, 0.95, r);
        base = mix(base, vec3(0.55, 0.62, 0.66), st * 0.55);
      } else if (uP > 6.5 && uP < 7.5) {
        vec2 p = vW.xz; float row = floor(p.y / 0.16), off = hh(vec2(row, 3.0)) * 2.0;
        float cl = floor((p.x + off) / 1.1);
        float seam = smoothstep(0.0, 0.05, fract(p.y / 0.16)) * smoothstep(0.0, 0.012, fract((p.x + off) / 1.1));
        float grain = 0.9 + 0.2 * nz(vec3(p.x * 5.0, p.y * 60.0, 1.0));
        base *= (0.8 + 0.34 * hh(vec2(row, cl))) * grain * mix(0.5, 1.0, seam);
      } else if (uP > 7.5 && uP < 8.5) {
        float u = vW.x + vW.z;
        base *= (0.93 + 0.12 * nz(vW * 2.5)) * mix(0.8, 1.06, smoothstep(0.0, 2.6, vW.y));
        if (N.y > -0.5 && vW.y < 1.0) base *= 0.72 * mix(0.8, 1.0, step(0.03, fract(u / 0.85)));
        else if (N.y > -0.5 && vW.y < 1.07) base *= 0.55;
      } else if (uP > 10.5 && uP < 11.5) {

      }[v] || null;

  // one guest's place, as set in the restaurant: plate with a dotted rim, an upturned bowl,
  // the NoZi napkin card, fork on the left, spoon on the right, a spoon above, a ribbed goblet
  function placeSetting(x, z, face, top, course1, k = 1) {
    const sx = Math.cos(face), sz = -Math.sin(face);    // the guest's right
    const fx = -Math.sin(face), fz = -Math.cos(face);   // towards the middle of the table
    const at = (a, b) => [x + sx * a * k + fx * b * k, z + sz * a * k + fz * b * k];
    if (STYLE === "wood") put("box", "#a9b79a", x, top + 0.002, z, face, 0.34 * k, 0.004, 0.4 * k, { s: 0.12, p: 4 });   // sage place mat on the bare wood
    if (STYLE === "cream") put("plate", C.charger, x, top - 0.006, z, face, 0.335 * k, 0.4, 0.335 * k, { s: 0.25, sh: 30 });   // cream charger plate
    if (!LO && AS.tagtarelka && AS.piyola && AS.stakan && SEATM < 70) {   // the restaurant's own place setting, from the ready-made models
      SEATM++;
      putA("tagtarelka", x, top, z, face, k, k, [242, 214, 150]);   // oltin tagtarelka: iliq oltin rang va metall yaltirashi
      if (!course1) putA("piyola", x, top + 0.018 * k, z, face, k);
      const m1 = (n, a, b, y = 0) => { if (!AS[n]) return; const [qx, qz] = at(a, b); putA(n, qx, top + y * k, qz, face, k); };
      m1("kartochka", 0, -0.105, 0.018);
      m1("vilka", -0.205, 0); m1("pichoq", 0.19, 0); m1("qoshiq", 0.235, 0);
      m1("stakan", 0.1, 0.2); m1("vino", 0.19, 0.14);
      return;
    }
    put("plate", C.gold, x, top - 0.003, z, face, 0.292 * k, 0.4, 0.292 * k, GOLD);   // thin gold rim
    put("plate", C.plate, x, top, z, face, 0.28 * k, 0.4, 0.28 * k, { s: 0.3, sh: 40, p: 1 });
    if (!course1) put("bowl", "#f4f2ee", x, top + 0.067, z, 0, 0.115 * k, -0.1, 0.115 * k, { s: 0.45, sh: 60, p: 14 });
    const [nx, nz] = at(0, -0.105);
    put("box", "#111214", nx, top + 0.024, nz, face, 0.1 * k, 0.003, 0.062 * k, { s: 0.3, sh: 30, p: 15 });
    if (LO) { const [gx, gz] = at(0.15, 0.15); put("goblet", C.glass, gx, top, gz, 0, 0.085, 0.17, 0.085, { a: 0.3, s: 0.9, sh: 90 }); return; }
    const [lx, lz] = at(-0.165, -0.01), [hx, hz] = at(-0.165, 0.075);
    put("box", C.silver, lx, top + 0.004, lz, face, 0.011, 0.004, 0.14 * k, { s: 0.8, sh: 60 });
    put("box", C.silver, hx, top + 0.004, hz, face, 0.024, 0.003, 0.045 * k, { s: 0.8, sh: 60 });
    const [rx, rz] = at(0.165, -0.02), [bx2, bz2] = at(0.165, 0.065);
    put("box", C.silver, rx, top + 0.004, rz, face, 0.011, 0.004, 0.13 * k, { s: 0.8, sh: 60 });
    put("ball", C.silver, bx2, top + 0.006, bz2, face, 0.036, 0.008, 0.05, { s: 0.9, sh: 70 });
    const [tx, tz] = at(-0.01, 0.185), [ux, uz] = at(0.06, 0.185);
    put("box", C.silver, tx, top + 0.004, tz, face + PI / 2, 0.01, 0.004, 0.12 * k, { s: 0.8, sh: 60 });
    put("ball", C.silver, ux, top + 0.006, uz, face + PI / 2, 0.03, 0.007, 0.042, { s: 0.9, sh: 70 });
    const [gx, gz] = at(0.15, 0.15);
    put("goblet", C.glass, gx, top, gz, 0, 0.085, 0.17, 0.085, { a: 0.3, s: 0.9, sh: 90, p: 3 });
    put("band", "#101114", gx, top + 0.152, gz, 0, 0.054, 0.018, 0.054, { s: 0.6, sh: 60 });   // black rim of the glass
  }

  // the restaurant's carved white chair: egg-shaped open back with carved leaves, grey velvet seat, cabriole front legs
  function chair(x, z, face) {

    const at = (a, b) => [x + a * c + b * s, z - a * s + b * c];   // a: sideways, b: towards the back
    const W = { s: 0.55, sh: 60 };

      put(LO ? "chairFLo" : "chairF", C.chair, x, 0, z, face, 1, 1, 1, W);
      put(LO ? "chairSLo" : "chairS", C.cushion, x, 0, z, face, 1, 1, 1, { s: 0.05, p: 4 });

    put("ring", C.chair, kx, 0.84, kz, face, 0.38, 0.48, 0.4, W);
    [-0.19, 0.19].forEach(a => { const [fx, fz] = at(a * 1.0, -0.215); put("ball", C.chair, fx, 0.02, fz, face, 0.05, 0.04, 0.07, W); });

  // tall gold candlestick with a crystal bead, a white vase, and a rounded bouquet like the restaurant's:
  // a dome of white and pale-blue hydrangea florets, peach and pink roses (layered petals), pale feather leaves, dark green foliage
  function centrepiece(x, z, top, seed = 1, lift = 0) {
    let sd = seed * 9301 + 49297;
    const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
    if (DECOR.gul === 0) return;   // the owner / agent asked for no flowers
    if (AS.gul) {   // the restaurant's own flower arrangement; on a round table it stands higher, on a thin gold stem, above the stands
      if (lift > 0) { put("column", C.gold, x, top, z, 0, 0.075, lift + 0.02, 0.075, { s: 0.85, sh: 70 }); put("disc", C.gold, x, top + 0.002, z, 0, 0.2, 0.4, 0.2, { s: 0.85, sh: 70 }); }
      putA("gul", x, top + lift, z, seed * 1.7, 1, lift > 0 ? 1.08 : 1); return;
    }
    put("column", C.gold, x, top, z, 0, 0.2, 0.56, 0.2, { s: 0.85, sh: 70 });
    put("ball", C.glass, x, top + 0.335, z, 0, 0.065, 0.065, 0.065, { a: 0.35, s: 1, sh: 90 });
    put("vase", "#f3f1ee", x, top + 0.555, z, 0, 0.17, 0.25, 0.17, { s: 0.55, sh: 60 });
    const vy = top + 0.79, cy = top + 0.95, R = 0.3;
    // foliage first, so the flowers sit in front of it
    const greens = ["#2f5b2b", "#3f7436", "#4c7a3a", "#356a3a"], NL = LO ? 8 : 15;
    for (let k = 0; k < NL; k++) {
      const th = k * 2.4 + rnd() * 0.5, len = 0.3 + rnd() * 0.16;
      put("leaf", greens[k % greens.length], x + Math.cos(th) * 0.04, vy, z + Math.sin(th) * 0.04, PI / 2 - th, 0.13 + rnd() * 0.05, len * 0.9, len, { t: -0.75 + rnd() * 1.05, s: 0.18, sh: 30 });
    }
    // hydrangea: many small cupped florets over a dome, each turned to face outwards
    const tints = ["#f7f6fa", "#ffffff", "#e9edf8", "#f5e8ee", "#dfe7f5", "#fbf7f2"], NF = LO ? 40 : 104;
    const spot = (yv, th, out) => { const phi = Math.acos(yv), sp = Math.sin(phi); return { phi, th, p: [x + Math.cos(th) * sp * R * 1.1 * out, cy + yv * R * 0.78 * out, z + Math.sin(th) * sp * R * 1.1 * out], n: [Math.cos(th) * sp, yv, Math.sin(th) * sp] }; };
    for (let k = 0; k < NF; k++) {
      const q = spot(1 - 0.92 * (k + 0.5) / NF, k * 2.39996 + rnd() * 0.3, 1 + (rnd() - 0.5) * 0.1), sz = 0.07 + rnd() * 0.03;
      put("floret", tints[k % tints.length], q.p[0], q.p[1], q.p[2], PI / 2 - q.th + rnd() * 0.6, sz, sz, sz, { t: q.phi * 0.92 + (rnd() - 0.5) * 0.25, s: 0.1, p: 0 });
    }
    // roses: three stacked, turning layers and a bud in the middle, standing out of the dome
    const roses = [["#f3b9a2", "#e8907f"], ["#f0a3b6", "#e0788f"], ["#f7dcc9", "#efb79e"], ["#f4b0a0", "#e68a7a"]], NR = LO ? 3 : 6;
    for (let k = 0; k < NR; k++) {
      const q = spot(0.18 + 0.7 * ((k * 0.618 + 0.1) % 1), k * 1.9 + 0.7, 1.08), [c1, c2] = roses[k % roses.length], f = 0.9 + rnd() * 0.25;
      [[0.092, 0, c1], [0.07, 0.014, c1], [0.05, 0.026, c2], [0.032, 0.036, c2]].forEach(([d, h, col], i) => {
        put("rose", col, q.p[0] + q.n[0] * h * f, q.p[1] + q.n[1] * h * f, q.p[2] + q.n[2] * h * f, PI / 2 - q.th + i * 0.62, d * f, d * f, d * f, { t: q.phi, s: 0.12, sh: 30 });
      });
    }
    // pale feather leaves rising at the top, a few dark leaves drooping at the sides
    for (let k = 0; k < (LO ? 3 : 6); k++) {
      const th = k * 1.05 + rnd() * 0.5, len = 0.27 + rnd() * 0.1;
      put("leaf", k % 2 ? "#f2c3cd" : "#f3ede4", x + Math.cos(th) * 0.12, cy + R * 0.55, z + Math.sin(th) * 0.12, PI / 2 - th, 0.1, len * 0.9, len, { t: -0.95 - rnd() * 0.3, s: 0.1 });
    }
    if (!LO) for (let k = 0; k < 6; k++) {
      const th = k * 1.13 + 0.4 + rnd() * 0.3, len = 0.26 + rnd() * 0.08;
      put("leaf", greens[k % greens.length], x + Math.cos(th) * R * 0.95, cy - 0.12, z + Math.sin(th) * R * 0.95, PI / 2 - th, 0.12, len * 0.9, len, { t: 0.1 + rnd() * 0.4, s: 0.18, sh: 30 });
    }
  }

  // ---------- the hall around the tables ----------
  // sky/lamp colours and light per place; walls, floor and ceiling are drawn from the inside only so the orbit camera is never blocked
  const HALLFX = {
    dish:    { sk1: [0.07, 0.09, 0.16], sk2: [0.07, 0.09, 0.16], tint: [1, 1, 1], lp: [0, 3, 0], lc: [0, 0, 0], am: 1, sun: 1, tm: 0, ao: 0, yaw: 0.6, pitch: 0 },

    mayda:   { sk1: [0.5, 0.3, 0.25], sk2: [0.1, 0.12, 0.26], tint: [1, 0.95, 0.88], lp: [0, 2.8, 0], lc: [1.15, 0.8, 0.45], am: 0.95, sun: 0.4, tm: 1, ao: 1, yaw: -0.4, pitch: -0.18, dist: 1.5 },
    toyxona: { sk1: [0.6, 0.38, 0.3], sk2: [0.09, 0.11, 0.26], tint: [1, 0.95, 0.9], lp: [0, 4.6, 0], lc: [1.5, 1.05, 0.6], am: 0.95, sun: 0.38, tm: 1, ao: 1, yaw: 0.15, pitch: -0.22, dist: 1.15 },
    butun:   { sk1: [0.6, 0.4, 0.34], sk2: [0.09, 0.12, 0.28], tint: [0.97, 0.96, 0.95], lp: [0, 5.4, 0], lc: [1.55, 1.15, 0.7], am: 0.95, sun: 0.4, tm: 1, ao: 1, yaw: 0.3, pitch: -0.22, dist: 1.1 },
  };
  let curHall = "mayda";
  const FX = () => HALLFX[curHall] || HALLFX.mayda;
  const surf = (c, x, y, z, r, w, h, t, mat) => put("quad", c, x, y, z, r, w, h, 1, Object.assign({ t }, mat));
  const wallN = (c, rx, rz, H, mat) => {   // four inward-facing walls
    surf(c, 0, H / 2, -rz, 0, 2 * rx, H, 0, mat); surf(c, 0, H / 2, rz, PI, 2 * rx, H, 0, mat);
    surf(c, -rx, H / 2, 0, PI / 2, 2 * rz, H, 0, mat); surf(c, rx, H / 2, 0, -PI / 2, 2 * rz, H, 0, mat);
  };
  const strip = (c, rx, rz, y, h, mat) => wallN2(c, rx, rz, y, h, mat);
  const wallN2 = (c, rx, rz, y, h, mat) => {
    surf(c, 0, y, -rz + 0.01, 0, 2 * rx, h, 0, mat); surf(c, 0, y, rz - 0.01, PI, 2 * rx, h, 0, mat);
    surf(c, -rx + 0.01, y, 0, PI / 2, 2 * rz, h, 0, mat); surf(c, rx - 0.01, y, 0, -PI / 2, 2 * rz, h, 0, mat);
  };
  const floorQ = (c, rx, rz, mat) => surf(c, 0, 0, 0, 0, 2 * rx, 2 * rz, -PI / 2, mat);
  const sky = () => put("ball", "#ffffff", 0, 0, 0, 0, 800, 800, 800, { p: 9 });
  const winOn = (side, rx, rz, pos, y, w, h) => {   // a lit window set into one wall; side 0 back, 1 front, 2 left, 3 right
    const o = 0.03;
    if (side === 0) surf("#ffffff", pos, y, -rz + o, 0, w, h, 0, { p: 12 });
    else if (side === 1) surf("#ffffff", pos, y, rz - o, PI, w, h, 0, { p: 12 });
    else if (side === 2) surf("#ffffff", -rx + o, y, pos, PI / 2, w, h, 0, { p: 12 });
    else surf("#ffffff", rx - o, y, pos, -PI / 2, w, h, 0, { p: 12 });
  };
  const curtainOn = (side, rx, rz, pos, y, w, h, col) => {
    [-1, 1].forEach(sg => {
      const o = sg * (w / 2 + 0.2);
      const x = side === 0 ? pos + o : side === 1 ? pos + o : side === 2 ? -rx + 0.18 : rx - 0.18;
      const z = side === 0 ? -rz + 0.18 : side === 1 ? rz - 0.18 : pos + o;
      const alongX = side < 2;
      put("box", col, x, y, z, 0, alongX ? 0.42 : 0.22, h, alongX ? 0.22 : 0.42, { p: 4, s: 0.06 });
    });
    const x = side === 0 || side === 1 ? pos : side === 2 ? -rx + 0.16 : rx - 0.16;
    const z = side === 0 ? -rz + 0.16 : side === 1 ? rz - 0.16 : pos;
    put("box", C.gold, x, y + h / 2 + 0.05, z, 0, side < 2 ? w + 1.2 : 0.14, 0.09, side < 2 ? 0.14 : w + 1.2, { s: 0.6, sh: 50 });
  };
  function chandelier(x, y, z, sc) {
    put("cyl", C.gold, x, y, z, 0, 0.03 * sc, 5, 0.03 * sc, { s: 0.7, sh: 50 });
    put("cyl", C.gold, x, y - 0.55 * sc, z, 0, 0.5 * sc, 0.05 * sc, 0.5 * sc, { s: 0.8, sh: 60 });
    put("cyl", C.gold, x, y - 0.85 * sc, z, 0, 0.95 * sc, 0.04 * sc, 0.95 * sc, { s: 0.8, sh: 60 });
    put("gem", "#e8f1fa", x, y - 0.95 * sc, z, 0, 0.3 * sc, 0.5 * sc, 0.3 * sc, { a: 0.55, s: 1, sh: 90 });
    for (let k = 0; k < 10; k++) {
      const a = k * 2 * PI / 10;
      put("ballLo", "#fff0c8", x + Math.cos(a) * 0.47 * sc, y - 0.78 * sc, z + Math.sin(a) * 0.47 * sc, 0, 0.09 * sc, 0.12 * sc, 0.09 * sc, { e: 1.6 });
      put("ballLo", "#fff0c8", x + Math.cos(a + 0.3) * 0.9 * sc, y - 0.9 * sc, z + Math.sin(a + 0.3) * 0.9 * sc, 0, 0.08 * sc, 0.1 * sc, 0.08 * sc, { e: 1.6 });
      put("ballLo", "#e8f1fa", x + Math.cos(a) * 0.7 * sc, y - 1.1 * sc, z + Math.sin(a) * 0.7 * sc, 0, 0.05 * sc, 0.08 * sc, 0.05 * sc, { a: 0.6, s: 1, sh: 90 });
    }
  }
  function plant(x, z, sc, col) {
    put("pot", "#c8b79b", x, 0, z, 0, 0.5 * sc, 0.55 * sc, 0.5 * sc, { s: 0.15 });

  // ---------- layouts ----------

  function buildLong(guests, rows, served) {

  function roundTable(cx, cz, seats, served, wall = 0) {

    centrepiece(cx, cz, top, 7 + Math.round(cx + cz * 5), 0.34);
    const spots = [];
    [{ r: 0.45, n: 10 }, { r: 0.27, n: 6 }, { r: 0.58, n: 12 }].forEach((g, gi) => {
      for (let k = 0; k < g.n; k++) { const a = (k + (gi === 2 ? 0.5 : gi * 0.5)) * 2 * PI / g.n + 0.1; spots.push([cx + Math.cos(a) * g.r, cz + Math.sin(a) * g.r, a]); }
    });

  const TERR_LINE = 5, TERR_SPARE = [-7.9, 3.8];   // Terrasa (table-scene x,z; hall x = 3.3 + z, hall y = 16.9 + x): 5 tables along the glass-wall strip (y 9.5 to 24.3), the 6th in the green corner by the brick wall (hall 7.1, 9.0)
  function buildRound(guests, served, seatsList, corner) {
    const n = seatsList && seatsList.length ? seatsList.length : Math.max(1, Math.ceil(guests / 14));
    LO = n > (PHONE ? 3 : 6);
    // Terrasa: the tables stand in ONE line along the glass wall (the carpet strip, 5 tables fit); more than 5 go to the spare spot by the entrance
    if (curHall === "terrasa") {
      const sp = 3.7, line = Math.min(n, TERR_LINE), list = [];
      for (let i = 0; i < n; i++) {
        const seatsI = seatsList && seatsList.length ? seatsList[i] : Math.min(14, guests - i * 14);
        if (i < line) { list.push(roundTable((i - (line - 1) / 2) * sp, 0, seatsI, served, -1)); continue; }   // glass-wall side stays free
        // the corner by the brick wall (hall 7.1, 9.0): the guest picks a long or a round table; the wall side stays free (max 80 guests = 6 tables, so one corner table)
        if (corner === "long") {
          const side = 4, gap = 0.62, L = side * gap + 0.5, n1 = items.length;
          const t = longRow(TERR_SPARE[1], Math.min(seatsI, 6), L, side, gap, 0.77, served, 1);
          for (let q = n1; q < items.length; q++) items[q].M.m[12] += TERR_SPARE[0];

    const tallest = Math.max(...PETAL_SHAPES.map(s => base0 * s.size * s.vb[1] / s.vb[0]));
    const base = H - Math.max(tallest * 0.55 + 34, H * 0.17);
    const top = Math.max(tallest * 0.5 + 70, H * 0.2);
    [
      { x: cx - span * 0.34, y: base - 14, ty: top + 10 },
      { x: cx, y: base + 14, ty: top + 34 },
      { x: cx + span * 0.34, y: base - 22, ty: top },
    ].forEach((d, i) => {
      const pw = Math.round(base0 * PETAL_SHAPES[i].size);
      slots[i] = { x: d.x, y: d.y, r: ANGLES[i] * PI / 180, w: pw };
      tops[i] = { x: d.x, y: d.ty };
      petalEls[i].style.setProperty("--pw", pw + "px");
    });
    drawFlower();
  }

  // ---------- the flower sways a little in the wind ----------
  // A sharp copy of the last frame's flower, softly cut out, rocks around its stem over the still picture.
  const flower = $("flower"), fctx = flower.getContext("2d");
  let flowerOk = false;
  function drawFlower() {
    const vw = film.videoWidth, vh = film.videoHeight;
    if (!vw || !vh || film.readyState < 2) return;
    const d = Math.min(devicePixelRatio || 1, 2);
    flower.width = Math.round(W * d); flower.height = Math.round(H * d);
    // the same "cover" fit the video uses
    const k = Math.max(W / vw, H / vh), dw = vw * k, dh = vh * k, ox = (W - dw) / 2, oy = (H - dh) / 2;
    try {
      fctx.setTransform(d, 0, 0, d, 0, 0);
      fctx.clearRect(0, 0, W, H);
      fctx.globalCompositeOperation = "source-over";
      fctx.drawImage(film, ox, oy, dw, dh);
      // keep only the flower: a soft oval around it in the picture
      const fx0 = ox + dw * 0.5, fy0 = oy + dh * 0.5, rx = dw * 0.26, ry = dh * 0.4;
      fctx.globalCompositeOperation = "destination-in";
      fctx.save(); fctx.translate(fx0, fy0); fctx.scale(1, ry / rx);
      const g = fctx.createRadialGradient(0, 0, rx * 0.55, 0, 0, rx);
      g.addColorStop(0, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,0)");
      fctx.fillStyle = g; fctx.fillRect(-rx, -rx, rx * 2, rx * 2);
      fctx.restore();
      fctx.globalCompositeOperation = "source-over";
      // it rocks around the bottom of its stem
      flower.style.transformOrigin = `${fx0}px ${oy + dh * 0.9}px`;
      flowerOk = true;
    } catch (e) { flowerOk = false; }
    flower.hidden = !flowerOk;
  }

  // ---------- the meadow in the wind (filmed in Google Flow) ----------
  // windIn starts on exactly the film's last frame: the big petals blow away. Then windFilm loops for good
  // (its first frame is windIn's last, and its end dissolves back into its start along the motion).
  // Until they can play, the swaying flower above stands in for them.
  const windIn = $("windIn"), windFilm = $("windFilm"), swirlFilm = $("swirlFilm");
  const WIND_IN_SRC = "kadupul-wind-in.mp4", WIND_SRC = "kadupul-wind.mp4", SWIRL_SRC = "kadupul-swirl.mp4";
  let windWanted = false, windPhase = "";
  function windLoad() {
    if (reduce) return;
    if (!windIn.getAttribute("src")) windIn.src = WIND_IN_SRC;
    if (!windFilm.getAttribute("src")) windFilm.src = WIND_SRC;
  }
  // switch classes with no fade, for frames that are identical anyway
  function instantly(els, fn) {
    els.forEach(e => { e.style.transition = "none"; });
    fn(); void stage.offsetWidth;
    els.forEach(e => { e.style.transition = ""; });
  }
  function windStart() {
    if (reduce) return;
    windWanted = true; windLoad();
    if (!swirlFilm.getAttribute("src")) { swirlFilm.preload = "auto"; swirlFilm.src = SWIRL_SRC; }
    windFilm.hidden = false;
    try { windFilm.currentTime = 0; } catch (e) {}
    if (windIn.readyState >= 2) {
      windPhase = "in"; windIn.hidden = false;
      try { windIn.currentTime = 0; } catch (e) {}
      instantly([windIn, windFilm, flower], () => { windIn.classList.add("on"); windFilm.classList.add("on"); flower.classList.add("off"); });
      const p = windIn.play();
      if (p && p.catch) p.catch(windLoop);
    } else windLoop();
  }
  function windLoop() {
    if (!windWanted) return;
    windPhase = "loop";
    const p = windFilm.play();
    if (p && p.catch) p.catch(windStop);
  }
  function windStop() {

    flower.classList.remove("off");
  }
  const windNow = () => windPhase === "in" ? windIn : windFilm;
  function windPause() { if (windWanted) windNow().pause(); }
  function windResume() { const v = windNow(); if (windWanted && v.paused) v.play().catch(() => {}); }
  windIn.addEventListener("ended", () => { if (windWanted && windPhase === "in") windLoop(); });
  windIn.addEventListener("error", () => { if (windPhase === "in") windLoop(); });
  windFilm.addEventListener("playing", () => {
    if (!windWanted) return;
    windFilm.classList.add("on"); flower.classList.add("off");
    // the loop is on screen now, showing the same picture the opening ended on
    if (windPhase === "loop" && !windIn.hidden) requestAnimationFrame(() => { windIn.classList.remove("on"); windIn.pause(); windIn.hidden = true; });
  });
  windFilm.addEventListener("error", windStop);
  // load them while the film plays, so they are ready when it ends
  film.addEventListener("playing", windLoad, { once: true });

  // the petals whirl round the flower before a window opens
  function swirlStop() {
    swirlFilm.classList.remove("on"); swirlFilm.pause();
    setTimeout(() => { if (!swirlFilm.classList.contains("on")) swirlFilm.hidden = true; }, 400);
  }

  // ---------- night-forest sound after the film: crickets and a soft wind, made for this site ----------
  // Web Audio loops it without a gap. It only plays once the guest turns sound on; it is quieter
  // inside Menyu and Banket and silent in Reklamalar, where the videos have their own sound.
  const AMB_SRC = "kadupul-tun.mp3", AMB_PAD = 0.2, AMB_LEN = 48, AMB_VOL = 0.6;
  let soundOn = false, actx = null, ambGain = null, ambState = 0, winKey = "";
  function ambEnsure() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) {
      try { actx = new AC(); } catch (e) { return; }
      ambGain = actx.createGain(); ambGain.gain.value = 0; ambGain.connect(actx.destination);
      // on iPhones, let it play even with the ring switch on silent, like the videos do
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    }
    if (actx.state === "suspended") actx.resume().catch(() => {});
    if (ambState) return;
    ambState = 1;
    fetch(AMB_SRC).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(b => new Promise((res, rej) => { const q = actx.decodeAudioData(b, res, rej); if (q && q.catch) q.catch(rej); }))
      .then(buf => {
        const s = actx.createBufferSource();
        s.buffer = buf; s.loop = true;
        s.loopStart = AMB_PAD; s.loopEnd = Math.min(buf.duration, AMB_PAD + AMB_LEN);
        s.connect(ambGain); s.start(0, AMB_PAD);
        ambState = 2; ambLevel();
      })
      // if the file cannot be decoded here, a plain looping audio element does the job (no fades)
      .catch(() => { ambState = 3; ambEl = new Audio(AMB_SRC); ambEl.loop = true; ambLevel(); });
  }
  let ambEl = null;
  function ambLevel() {
    const k = !soundOn || mode === "intro" || document.hidden ? 0
      : (mode === "open" || mode === "enter") ? (winKey === "reklamalar" ? 0 : 0.4) : 1;
    if (ambEl) {
      if (k > 0) { ambEl.volume = Math.min(1, k * AMB_VOL); if (ambEl.paused) ambEl.play().catch(() => {}); }
      else if (!ambEl.paused) ambEl.pause();
      return;
    }
    if (!ambGain) return;
    const now = actx.currentTime, g = ambGain.gain, to = k * AMB_VOL;
    g.cancelScheduledValues(now); g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(to, now + (to > g.value ? 2.5 : 0.7));
  }
  document.addEventListener("visibilitychange", () => {
    if (ambEl) { ambLevel(); return; }
    if (!actx) return;
    if (document.hidden) actx.suspend().catch(() => {});
    else if (soundOn) actx.resume().then(ambLevel).catch(() => {});
  });

  // ---------- the wind: a few petals carried round the flower, a few falling across the screen ----------
  const ORBITERS = [], DRIFTERS = [];
  (function seed() {
    let s = 5;
    const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 7; i++) ORBITERS.push({
      a0: rnd() * 2 * PI, w: 0.35 + rnd() * 0.3, r: 0.3 + rnd() * 0.28, h: rnd() * 0.14 - 0.02,
      size: 18 + rnd() * 14, spin: (rnd() - 0.5) * 1.6, rot0: rnd() * 6, bob: rnd() * 6, flip: 1.2 + rnd() * 1.5, shape: i % 3,
    });
    for (let i = 0; i < 5; i++) DRIFTERS.push({
      x0: rnd(), y0: rnd(), vx: 0.025 + rnd() * 0.035, vy: 0.02 + rnd() * 0.03,
      size: 16 + rnd() * 14, spin: (rnd() - 0.5) * 1.2, rot0: rnd() * 6, sway: rnd() * 6, flip: 0.8 + rnd() * 1.2, shape: (i + 1) % 3,
    });
  })();
  function drawWind(time, strength) {
    if (strength <= 0.01 || reduce) return;
    const cx = W / 2, cy = H * 0.5;
    const R = Math.min(Math.max(W, H * 0.8) * 0.5, 620);
    const items = [];
    for (const p of ORBITERS) {
      const a = p.a0 + p.w * time, depth = Math.sin(a);
      const x = cx + R * p.r * 2 * Math.cos(a);
      const y = cy + H * p.h + R * p.r * 0.36 * depth + 6 * Math.sin(time * 1.7 + p.bob);
      const sc = 0.72 + 0.35 * (depth + 1) / 2, alpha = strength * (depth < 0 ? 0.32 : 0.9);
      items.push({ d: depth, f: () => drawPetal(x, y, p.size * sc, p.rot0 + p.spin * time, alpha, p.shape, Math.cos(time * p.flip + p.rot0)) });
    }
    items.sort((a, b) => a.d - b.d).forEach(it => it.f());
    for (const p of DRIFTERS) {
      const x = ((p.x0 + p.vx * time) % 1.2 - 0.1) * W + 22 * Math.sin(time * 0.9 + p.sway);
      const y = ((p.y0 + p.vy * time) % 1.2 - 0.1) * H;
      drawPetal(x, y, p.size, p.rot0 + p.spin * time + 0.4 * Math.sin(time * 0.9 + p.sway), strength * 0.8, p.shape, Math.cos(time * p.flip + p.sway));
    }
  }
  // a burst of small petals as a petal opens into its window
  let burst = null;
  function drawBurst(now) {
    if (!burst) return;
    const e = (now - burst.at) / 1000;
    if (e > 1.2) { burst = null; return; }
    for (let k = 0; k < 12; k++) {
      const a = k * 2.39996 + burst.seed, sp = 110 + (k % 5) * 35;
      const x = burst.x + Math.cos(a) * sp * e, y = burst.y + Math.sin(a) * sp * e + 150 * e * e;
      drawPetal(x, y, 12 + (k % 4) * 5, a + e * 3, 1 - sstep(0.5, 1.2, e), k % 3, Math.cos(e * 6 + k));
    }
  }

  // ---------- the entrance: three petals spiral round the flower, fly at the glass, stick and slide down ----------
  function flowerCentre() {
    const vw = film.videoWidth || 1280, vh = film.videoHeight || 720;
    const k = Math.max(W / vw, H / vh), dh = vh * k;
    return { x: W / 2, y: (H - dh) / 2 + dh * 0.42, rx: Math.min(W * 0.47, dh * 0.55), dh };
  }
  // where a petal is at a moment of its spiral (tau 0..1): it widens out from the heart of the flower,
  // circles it 1.6 times, smaller and dimmer when it passes behind, turning over as it goes
  function orbitPose(i, tau) {
    const f = flowerCentre(), e = ioSine(tau);
    const th = PI * 0.5 + i * 2.1 + 2 * PI * 1.6 * e;
    const r = sstep(0, 0.45, tau), depth = Math.sin(th);
    return {
      x: f.x + f.rx * r * Math.cos(th),
      y: f.y + f.rx * 0.32 * r * depth - f.dh * 0.05 * Math.sin(PI * tau),
      w: slots[i].w * 0.72 * lerp(0.35, 1, sstep(0, 0.3, tau)) * lerp(0.6, 1, (depth + 1) / 2),
      rot: th * 0.9 + i * 1.3 + 0.5 * Math.sin(tau * 7 + i),
      flip: Math.cos(th * 1.4 + i),
      alpha: Math.min(1, tau * 6) * (0.7 + 0.3 * sstep(-0.6, 0.2, depth)),
    };
  }
  function drawEntrance(i, t) {
    const tau = (t - ORBIT_START[i]) / ORBIT;
    if (tau < 1) { const p = orbitPose(i, tau); drawPetal(p.x, p.y, p.w, p.rot, p.alpha, i, p.flip); return; }
    // it breaks out of the spiral and flies at the glass, growing as it nears, with a last twirl
    const s = clamp01((t - ORBIT_START[i] - ORBIT) / FLIGHT);
    const p = orbitPose(i, 1), top = tops[i], slot = slots[i];
    const side = i === 0 ? -1 : i === 2 ? 1 : (p.x < top.x ? -1 : 1);
    const C = { x: (p.x + top.x) / 2 + side * W * 0.12, y: Math.min(p.y, top.y) - H * 0.06 };
    const e = Math.pow(s, 1.5);
    const x = (1 - e) * (1 - e) * p.x + 2 * (1 - e) * e * C.x + e * e * top.x;
    const y = (1 - e) * (1 - e) * p.y + 2 * (1 - e) * e * C.y + e * e * top.y;
    const rot0 = slot.r + ((((p.rot - slot.r + PI) % (2 * PI)) + 2 * PI) % (2 * PI)) - PI;
    const twirl = (1 - sstep(0.2, 1, s)) * PI * (i === 1 ? -1 : 1);
    drawPetal(x, y, lerp(p.w, slot.w * 1.12, sstep(0, 1, s)), lerp(rot0, slot.r, sstep(0.25, 1, s)) + twirl,
      lerp(p.alpha, 1, s), i, lerp(p.flip, 1, sstep(0.15, 0.85, s)));
  }
  // where a petal meets the glass: a soft flash and a few drops of dew thrown off
  function drawSplash(i, d) {
    const top = tops[i], slot = slots[i], a = 1 - d / 0.6;
    const g = ctx.createRadialGradient(top.x, top.y, 0, top.x, top.y, slot.w * 0.9);
    g.addColorStop(0, `rgba(255,255,255,${(0.28 * a * a).toFixed(3)})`); g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g; ctx.fillRect(top.x - slot.w, top.y - slot.w, slot.w * 2, slot.w * 2);
    ctx.fillStyle = "#ffffff";
    for (let k = 0; k < 7; k++) {
      const ang = k * 0.9 + i * 1.7, dist = slot.w * (0.45 + 0.35 * sstep(0, 0.6, d)) * (0.8 + (k % 3) * 0.15);
      ctx.globalAlpha = 0.7 * a;
      ctx.beginPath(); ctx.arc(top.x + Math.cos(ang) * dist, top.y + Math.sin(ang) * dist * 0.8 + 40 * d * d, 1.2 + (k % 3) * 0.7, 0, 2 * PI); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // a moist trail on the glass behind each sliding petal, drying a moment after it stops
  let entranceLive = false;
  function drawTrails(t) {
    for (let i = 0; i < 3; i++) {
      const k = clamp01((t - slideAt(i)) / SLIDE_DUR);
      const fade = 1 - clamp01((t - slideAt(i) - SLIDE_DUR) / 2.5);
      if (k <= 0 || fade <= 0) continue;
      const ek = ioSine(k), top = tops[i], slot = slots[i], w = slot.w * 0.3;
      const x1 = lerp(top.x, slot.x, ek), y1 = lerp(top.y, slot.y, ek);
      const g = ctx.createLinearGradient(top.x, top.y, x1, y1);
      g.addColorStop(0, "rgba(220,235,255,0)"); g.addColorStop(0.6, `rgba(220,235,255,${(0.06 * fade).toFixed(3)})`);
      g.addColorStop(1, `rgba(235,245,255,${(0.13 * fade).toFixed(3)})`);
      ctx.strokeStyle = g; ctx.lineWidth = w; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(top.x, top.y); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.lineWidth = 1.2; ctx.strokeStyle = `rgba(255,255,255,${(0.12 * fade).toFixed(3)})`;
      ctx.beginPath(); ctx.moveTo(top.x + w * 0.42, top.y); ctx.lineTo(x1 + w * 0.42, y1); ctx.stroke();
    }
  }

  // ---------- state ----------
  // intro: the film plays · rest: film over, wind blows · enter/leave: a petal opening or closing · open: window shown
  let mode = "intro";
  let after = null;
  let windOn = 0;
  let chosen = -1;

  const clock = now => after ? after.t0 + (now - after.at) / 1000 : (film.currentTime || 0);
  function rest(t0) {
    mode = "rest";
    after = { t0, at: performance.now() };
    windOn = performance.now();
    stage.classList.add("rest");
    // the film never loaded: show its last frame as a picture until it does
    if (film.readyState < 2) stage.classList.add("still");
    drawFlower(); setTimeout(drawFlower, 350);
    windStart();
    soundUI(); ambLevel();
  }

  // ---------- one frame ----------
  function render(now) {
    const t = clock(now);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const wind = mode === "intro" ? 0 : sstep(0, 1.2, (now - windOn) / 1000);
    if (mode !== "open") drawWind(now / 1000, mode === "rest" ? wind : wind * 0.5);
    drawBurst(now);

    // the entrance plays once, on the film's clock; skipping, a window or reduced motion settles it at once
    const live = !reduce && t < UI_END && (mode === "intro" || mode === "rest");
    if (live) entranceLive = true;
    else if (mode !== "intro" && mode !== "rest") entranceLive = false;
    if (entranceLive && t < UI_END + 2.6) drawTrails(t);
    for (let i = 0; i < 3; i++) {
      const el = petalEls[i];
      el.classList.toggle("gone", mode === "open" || (mode === "enter" && (i !== chosen || now - enterAt > 260)));
      if (live && t < ORBIT_START[i]) { el.hidden = true; continue; }
      if (live && t < stuckAt(i)) { el.hidden = true; drawEntrance(i, t); continue; }
      el.hidden = false;
      const since = live ? t - stuckAt(i) : 99;
      if (live && since < 0.6) drawSplash(i, since);
      const k = live ? clamp01((t - slideAt(i)) / SLIDE_DUR) : 1;
      const ek = ioSine(k);
      const wob = Math.sin(k * PI * 3 + i) * 5 * Math.sin(PI * k);
      const sway = reduce ? 0 : wind * (3.5 * Math.sin(now / 1000 * 1.4 + i * 1.7));
      const bob = reduce ? 0 : wind * 2.5 * Math.sin(now / 1000 * 1.1 + i * 2.3);
      el.style.left = (lerp(tops[i].x, slots[i].x, ek) + wob) + "px";
      el.style.top = (lerp(tops[i].y, slots[i].y, ek) + bob) + "px";
      el.style.setProperty("--rot", (ANGLES[i] + sway).toFixed(2) + "deg");
      let sc = reduce ? 1 : 1 + 0.12 * Math.exp(-since * 7) * Math.cos(since * 18);
      if (i === chosen && (mode === "enter" || mode === "leave")) sc = 1.18;
      el.classList.toggle("chosen", i === chosen && mode === "enter");
      el.style.setProperty("--s", sc.toFixed(4));
    }
    const done = t >= UI_END || (mode !== "intro" && mode !== "rest");
    brand.classList.toggle("on", (mode === "rest" || mode === "intro") && t >= UI_END - 0.6);
    skipBtn.hidden = done;
    replayBtn.hidden = !(mode === "rest" && done);
    modeCtl.hidden = !(mode === "rest" && done);
    adminBtn.hidden = !(mode === "rest" && done);
    // during the film it turns the film's sound on; afterwards, the night forest
    soundBtn.hidden = !(mode === "intro" || mode === "rest");
  }

  // ---------- film control ----------
  film.addEventListener("ended", () => { if (mode === "intro") rest(film.duration || 10); });
  film.addEventListener("error", () => { gate.hidden = true; rest(UI_END + 0.1); });
  function start() {
    gate.hidden = true;
    const p = film.play();
    if (p && p.catch) p.catch(err => { if (err && err.name === "NotAllowedError") gate.hidden = false; });
  }
  function seek(t) { try { film.currentTime = t; } catch (e) {} }
  function toEnd(then) {
    film.pause();
    const end = Math.max(0, (film.duration || 10) - 0.05);
    if (Math.abs(film.currentTime - end) < 0.02) { stage.classList.remove("still"); then && then(); return; }
    film.addEventListener("seeked", () => { stage.classList.remove("still"); drawFlower(); then && then(); }, { once: true });
    seek(end);
  }
  // A slow connection, or a phone that will not start a film by itself: after a few seconds offer a tap
  // to start, and if the film still has not begun, open the petals over a still picture of its last frame.
  let filmStarted = false;
  film.addEventListener("playing", () => { filmStarted = true; gate.hidden = true; if (mode === "intro") stage.classList.remove("still"); });
  setTimeout(() => { if (!filmStarted && mode === "intro" && !location.hash) gate.hidden = false; }, 4000);
  setTimeout(() => {
    if (filmStarted || mode !== "intro" || location.hash) return;
    gate.hidden = true; toEnd(); rest(UI_END + 0.1);
  }, 14000);
  skipBtn.addEventListener("click", () => { gate.hidden = true; entranceLive = false; toEnd(); rest(UI_END + 0.1); });
  replayBtn.addEventListener("click", () => {
    after = null; mode = "intro"; flower.hidden = true;
    stage.classList.remove("rest");
    windStop(); soundUI(); ambLevel();
    seek(0); start();
  });
  gate.addEventListener("click", start);
  function soundUI() {
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    soundLabel.textContent = soundOn ? "Ovozni o‘chirish" : mode === "intro" ? "Ovozni yoqish" : "Tun ovozini yoqish";
    $("wave").style.display = soundOn ? "" : "none";
    $("cross").style.display = soundOn ? "none" : "";
  }
  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    film.muted = !soundOn;
    if (soundOn) ambEnsure();
    soundUI(); ambLevel();
    if (soundOn && film.paused && mode === "intro") start();
  });
  $("wave").style.display = "none";

  // ---------- section windows ----------
  // Stol raqami: QR kartochka manzili ...?t=5#qr bo'lsa, shu seans davomida eslab qolinadi
  const PLACES = { terrasa: { name: "Terrasa", n: 10 }, kichik: { name: "Kichik zal", n: 18 }, toyxona: { name: "To‘yxona", n: 0 } };
  const LOC = (() => {

  // ----- Banket -----

  const bk = { step: 0, type: "banket", guests: 30, date: "", time: "18:00", hall: null, shape: null, rows: null, corner: "round", change: false,
    items: {}, order: [], course: {}, sec: "", view: "dasturxon", name: "", phone: "", note: "", sent: false, posted: "", link: "",
    rest: null, tcount: null, tview: null, lastDish: null, plates: {}, chat: [], chatOpen: false, chatBusy: false, agGuided: false, decor: {}, agq: 0, agTier: "", agBudget: 0, agTotal: 0, agKind: "", agFirst: "", agSecond: "", agWater: "", waterN: 0, askWater: 0, waterAsked: 0, event: "", pop: {}, popLoaded: false };

  // ----- kilogramm bilan hisoblanadigan taomlar: kishiga gramm, stol va tarelkalarga bo‘linadi -----
  const KG_STEP = 50, PLATE_PER = 5, PLATE_STEP = 5;     // jami 50 g gacha yuqoriga; har 5 kishiga 1 tarelka
  const ceilTo = (v, st) => Math.ceil(v / st - 1e-9) * st;

  const kgInfo = d => {
    if (d.bx) return null;

    if (m && d.n > 0) { const w = parseFloat(m[1].replace(",", ".")) * (m[2].toLowerCase() === "kg" ? 1000 : 1); if (w > 0) return { price: Math.round(d.n / w * 1000), gpp: 100 }; }

  };
  const platesOf = (g, d) => Math.max(1, Math.ceil(g / PLATE_PER) + ((bk.plates && bk.plates[d.id]) || 0));
  const splitPlates = (grams, n) => { const out = []; let left = grams; for (let i = 0; i < n; i++) { const g = i === n - 1 ? left : Math.min(left, ceilTo(left / (n - i), PLATE_STEP)); out.push(g); left -= g; } return out; };
  const fmtG = g => g >= 1000 ? String(g / 1000).replace(".", ",") + " kg" : g + " g";
  const plateText = a => { const c = {}; a.forEach(g => { c[g] = (c[g] || 0) + 1; }); return Object.keys(c).map(g => c[g] + " × " + fmtG(+g)).join(", "); };
  const autoShape = () => (bk.type === "toy" || (bk.guests >= 12 && bk.guests <= 14)) ? "round" : "long";
  const shapeNow = () => bk.shape || autoShape();
  const hallCap = h => h.cap || h.max;
  const autoHall = g => HALLS.find(h => g <= h.max);
  const hallNow = () => (bk.hall && HALLS.find(h => h.id === bk.hall && bk.guests <= hallCap(h))) || autoHall(bk.guests);
  // long tables: one row, or two side by side once there are more than 20 guests
  const rowsNow = () => shapeNow() === "long" ? Math.max(1, Math.min(4, bk.guests, bk.rows || (bk.guests > 40 ? 2 : 1))) : 1;
  // round tables: how the guests sit. When they do not divide by 14 the guest chooses what happens to the rest.
  const needRest = () => shapeNow() === "round" && bk.guests > ROUND_SEATS && bk.guests % ROUND_SEATS !== 0;
  const roundSeats = () => {
    const g = bk.guests, full = Math.floor(g / ROUND_SEATS), rem = g - full * ROUND_SEATS;
    if (bk.rest === "count") {
      const T = Math.max(1, Math.min(g, bk.tcount || Math.ceil(g / ROUND_SEATS))), b = Math.floor(g / T), x = g - b * T;
      return Array.from({ length: T }, (_, i) => b + (i < x ? 1 : 0));
    }
    if (g <= ROUND_SEATS || rem === 0) return Array.from({ length: Math.max(1, Math.ceil(g / ROUND_SEATS)) }, (_, i) => Math.min(ROUND_SEATS, g - i * ROUND_SEATS));
    const mode = bk.rest || "own";
    if (mode === "join") return Array.from({ length: full }, (_, i) => i === full - 1 ? ROUND_SEATS + rem : ROUND_SEATS);
    return Array.from({ length: full + 1 }, (_, i) => i < full ? ROUND_SEATS : rem);
  };
  const tablesNow = () => shapeNow() === "round" ? roundSeats().length : rowsNow();
  const chosenItems = () => {
    const ids = bk.order.filter(id => (bk.items[id] || 0) > 0);
    Object.keys(bk.items).forEach(id => { if (bk.items[id] > 0 && !ids.includes(id)) ids.push(id); });
    return ids.map(id => ({ d: byId[id], q: bk.items[id], course: courseOf(id) }));
  };
  // the dishes go to the tables in turn: 1st dish to table 1, 2nd to table 2, ... then round again.
  // Every table is priced from its own dishes only.
  const units = () => {
    let list;
    if (shapeNow() === "round") list = roundSeats().map(g => ({ guests: g, sets: 1 }));
    else {
      const r = rowsNow(), per = Math.ceil(bk.guests / r);
      list = Array.from({ length: r }, (_, i) => { const g = i < r - 1 ? per : bk.guests - per * (r - 1); return { guests: g, sets: 1 }; });   // tanlangan miqdor o‘zi turadi, avtomatik ko‘paytirilmaydi
    }
    list.forEach(u => { u.items = []; u.kgs = []; });
    const all = chosenItems();
    all.filter(x => !kgInfo(x.d)).forEach((x, k) => list[k % list.length].items.push(x));
    // kilogrammli taom hamma stolga boradi, har stolga o‘z mehmonlari soniga qarab
    all.filter(x => kgInfo(x.d)).forEach(x => {
      const ki = kgInfo(x.d);
      list.forEach(u => { const grams = ceilTo(u.guests * ki.gpp, KG_STEP); u.kgs.push({ d: x.d, course: x.course, price: ki.price, grams, plates: splitPlates(grams, platesOf(u.guests, x.d)), cost: Math.round(grams / 1000 * ki.price) }); });
    });
    list.forEach(u => { u.one = u.items.reduce((s, x) => s + (x.d.n || 0) * x.q, 0); u.kgCost = u.kgs.reduce((s, k) => s + k.cost, 0); u.cost = u.one * u.sets + u.kgCost; });
    return list;
  };
  const sets = () => units().reduce((s, u) => s + u.sets, 0);
  const foodTotal = () => units().reduce((s, u) => s + u.cost, 0);
  const tblWord = () => shapeNow() === "round" ? "stol" : "qator";
  const tviewNow = () => {

  const courseOf = id => bk.course[id] || AUTO_COURSE[byId[id].sec] || "c2";
  const tableOf = id => { const i = chosenItems().filter(x => !kgInfo(x.d)).findIndex(x => x.d.id === id); return i < 0 ? 0 : i % tablesNow(); };
  const emptyTable = () => tablesNow() > 1 && units().some(u => !u.items.length && !u.kgs.length);
  const unpriced = () => chosenItems().filter(x => x.d.n == null);
  const tableText = () => {

  };

  // ----- 3D halls: Three.js and the hall file load only when a guest opens one -----
  // The hall itself (walls, floor, ceiling, lamps) is the Blender model, drawn by Three.js on a canvas behind the table scene;
  // the tables, chairs and dishes stay the table scene's own, so they follow every choice. Both use the same camera.
  const HALL3D = { terrasa: "terrasa", mayda: "kichik", toyxona: "katta" };
  // where the middle of the table area sits in the hall (metres, Blender x and y=-z) and how the tables are turned (their long side along the hall)
  const HALL_AT = { terrasa: { x: 3.3, z: -16.9 }, mayda: { x: 0, z: -12.8 }, toyxona: { x: 0, z: -13.5 } };
  const hallFail = {};
  const hallKey = () => { const k = HALL3D[hallNow().id]; return k && !hallFail[k] ? k : null; };
  let hs = null, hsTimer = 0;
  function disposeHall() {
    if (!hs) return;
    hs.dead = true; if (hs.api) hs.api.dispose();
    hs.canvas.remove(); hs = null; clearInterval(hsTimer);
    if (t3d) t3d.setHook(null);
  }
  function startHall(key, id) {
    const canvas = document.createElement("canvas");
    canvas.className = "hallc";
    const me = hs = { key, id, canvas, api: null, dead: false };
    import("./zal/viewer.js").then(m => m.start({ canvas, id: key, url: "./zal/" + key + ".bin", shell: true }))
      .then(a => { if (me.dead) { a.dispose(); return; } me.api = a; rebuild3D(); })
      .catch(e => { if (me.dead) return; console.error("zal:", e); hallFail[key] = true; disposeHall(); rebuild3D(); say("Zal ochilmadi: " + String((e && e.message) || e).slice(0, 90), 15000); });
    // the window was closed or left: stop drawing

  }
  // table scene point -> hall point: turned a quarter so the long side runs along the hall, then moved to the table area
  function toHall(p, at) { return [at.x + p[2], p[1], at.z - p[0]]; }
  function attachHall(host) {
    const key = hallKey();
    if (!key) { disposeHall(); return; }
    if (hs && hs.key !== key) disposeHall();

  }

  // one 3D table, created once and moved between steps
  let t3d = null;

  function mount3D(host) {

  function rebuild3D() {
    if (!t3d) return;
    const round = shapeNow() === "round";

    const tillaQ = x => !isT(x) ? x.q : round ? Math.max(2, x.q) : Math.min(x.q, 2 * Math.max(1, Math.ceil(bk.guests / Math.max(1, rowsNow() || 1) / 14)));   // doira: 2 ta; uzun qator: har ~14 kishiga 1 juft (ko'payib ketmasin)   // doira stolga odatda 2 ta pishloq va 2 ta meva assorti
    // "100гр" taom (yaxna): q = 100 grammlar soni (butun banket); stolda bitta lagan ~200 gr, har stolga o'z ulushi

          <div class="hub-kv"><span>Sayt ochilgan</span><b>${esc(S.opened)}</b></div>
          <div class="hub-kv"><span>Oxirgi yangilanish</span><b>${esc(S.updated)}</b></div>
          ${S.name ? `<div class="hub-kv"><span>Yaratuvchi</span><b>${esc(S.name)}</b></div>` : ""}
        </div>
        <div class="hub-card">
          <p><b>Sizga ham shunday sayt kerak bo‘lsa, bizga yozing.</b></p>
          ${tg ? `<a class="btn primary" href="https://t.me/${esc(tg)}" target="_blank" rel="noopener" style="justify-content:center">Telegram: @${esc(tg)}</a>` : ""}
          ${tel ? `<div class="hub-kv"><span>Telefon</span><b>${esc(tel)}</b></div><a class="btn" href="tel:${esc(tel.replace(/[^\d+]/g, ""))}" style="justify-content:center">Qo‘ng‘iroq qilish</a>` : ""}
        </div>`;
    }
    return "";
  }
  // 2-qadam (Gmail va kod olish) faqat 1-qadamdagi tugma bosilib, mehmon sahifaga qaytgach ochiladi
  const S1_WAIT = 25000;
  let s1At = 0, s1Timer = 0;
  try { s1At = parseInt(sessionStorage.getItem("nozi_s1"), 10) || 0; } catch (e) {}
  const s1Open = () => s1At > 0 && Date.now() - s1At >= S1_WAIT && document.visibilityState === "visible";
  function s1Tick() {
    clearInterval(s1Timer); s1Timer = 0;
    if (!s1At) return;
    s1Timer = setInterval(() => {
      if (hubEl.hidden || hubView !== "kod") { clearInterval(s1Timer); s1Timer = 0; return; }
      if (s1Open()) { clearInterval(s1Timer); s1Timer = 0; const m = hubEl.querySelector("#hubMail"); if (!m || !m.value) drawHub(); else s1Apply(); }
    }, 1000);
  }
  function s1Apply() {
    const m = hubEl.querySelector("#hubMail"), g = hubEl.querySelector("[data-hub=getcode]"), box = hubEl.querySelector("#hubStep2"), note = hubEl.querySelector("#hubLock");
    if (m) m.disabled = false; if (g) g.disabled = false; if (box) box.style.opacity = ""; if (note) note.hidden = true;
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !hubEl.hidden && hubView === "kod" && s1Open() && hubEl.querySelector("#hubMail:disabled")) s1Apply(); });
  function hubCode() { try { return localStorage.getItem("nozi_kod") || ""; } catch (e) { return ""; } }
  function drawHub() { hubEl.innerHTML = `<div class="hub-in">${hubHTML()}</div>`; hubEl.scrollTop = 0; }
  function openHub() {
    hubMode = true; hubView = "main"; drawHub();
    hubEl.hidden = false; void hubEl.offsetWidth; hubEl.classList.add("on");
  }
  function closeHub(done) {
    hubEl.classList.remove("on");
    setTimeout(() => { hubEl.hidden = true; if (done) done(); }, 460);
  }
  const hubMsg = (t, bad) => { const m = hubEl.querySelector("#hubMsg"); if (!m) return; m.hidden = !t; m.className = bad ? "hub-err" : "hub-ok"; m.textContent = t || ""; };
  hubEl.addEventListener("click", e => {
    const b = e.target.closest("[data-hub]"); if (!b) return;
    const a = b.dataset.hub;
    if (a === "menu") return closeHub(() => enter(0, "menyu"));
    if (a === "review") { s1At = Date.now(); try { sessionStorage.setItem("nozi_s1", String(s1At)); } catch (e) {} s1Tick(); const n = hubEl.querySelector("#hubLock"); if (n) n.textContent = "Sharhni yozib, shu oynaga qayting. Kod olish tugmasi bir necha soniyadan keyin ochiladi."; return; }
    if (a === "ads") return closeHub(() => enter(1, "reklamalar"));
    if (a === "site") { hubMode = false; return closeHub(); }
    if (a === "home") { hubView = "main"; return drawHub(); }
    if (["kod", "wifi", "fikr", "aloqa", "about"].includes(a)) { hubView = a; return drawHub(); }
    if (a === "copy" || a === "copypass") {
      const t = (hubEl.querySelector(a === "copy" ? "#hubCode" : "#hubPass") || {}).textContent || "";
      (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => say("Nusxalandi"), () => say("Nusxalab bo‘lmadi, qo‘lda yozib oling"));
      return;
    }
    if (a === "getcode") {
      const mail = ((hubEl.querySelector("#hubMail") || {}).value || "").trim().toLowerCase();
      if (!/^[a-z0-9._+-]{3,64}@gmail\.com$/.test(mail)) return hubMsg("Gmail manzilini to‘g‘ri yozing, masalan ismingiz@gmail.com", true);
      if (hubBusy) return; hubBusy = true; b.disabled = true; b.textContent = "Kod tayyorlanmoqda…";
      fetch("/api/kod", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: mail, stol: TABLE, joy: WHERE }) }).then(r => r.json().catch(() => ({})).then(j => ({ r, j }))).then(({ r, j }) => {
        hubBusy = false;
        if (r.ok && j.ok) { try { localStorage.setItem("nozi_kod", j.code); } catch (e) {} drawHub(); }
        else { b.disabled = false; b.textContent = "Sharh yozdim, kod olish"; hubMsg(j.error || "Kod olib bo‘lmadi. Birozdan keyin urinib ko‘ring.", true); }
      }).catch(() => { hubBusy = false; b.disabled = false; b.textContent = "Sharh yozdim, kod olish"; hubMsg("Internet yo‘q yoki server javob bermadi.", true); });
    }
  });
  hubEl.addEventListener("submit", e => {
    if (e.target.id !== "hubForm") return;
    e.preventDefault();
    const text = hubEl.querySelector("#hubTxt").value.trim(), hp = hubEl.querySelector("#hubHp").value;
    if (text.length < 5) return hubMsg("Fikr juda qisqa. Bir-ikki gap yozing.", true);
    if (hubBusy) return; hubBusy = true;
    const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Yuborilmoqda…";
    fetch("/api/fikr", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, website: hp, stol: TABLE, joy: WHERE }) })
      .then(r => r.json().catch(() => ({})).then(j => ({ r, j }))).then(({ r, j }) => {
        hubBusy = false;
        if (r.ok && j.ok) { hubView = "fikrok"; drawHub(); }
        else { btn.disabled = false; btn.textContent = "Yuborish"; hubMsg(j.error || "Yuborib bo‘lmadi. Birozdan keyin urinib ko‘ring.", true); }
      }).catch(() => { hubBusy = false; btn.disabled = false; btn.textContent = "Yuborish"; hubMsg("Internet yo‘q yoki server javob bermadi.", true); });
  });

  // ---------- loop ----------
  function loop(now) {
    if (!window.__hold) render(now);
    requestAnimationFrame(loop);
  }

  // test hook: render a given moment of the intro, or of the resting wind
  window.__seek = (t, windSec) => new Promise(res => {
    window.__hold = true; gate.hidden = true; film.pause();
    const end = film.duration || 10;
    const fake = performance.now();
    if (t >= end) {
      stage.classList.add("rest"); mode = "rest"; after = { t0: t, at: fake }; windOn = fake - (windSec || 3) * 1000;
      toEnd(() => { render(fake); res(); });
      return;
    }
    mode = "intro"; after = null; stage.classList.remove("rest"); flower.hidden = true; seek(t);
    film.addEventListener("seeked", () => { render(fake); res(); }, { once: true });
  });

  addEventListener("resize", layout);
  layout(); applyMode();
  // a table card's QR code or NFC tag opens straight into a section: …#menyu, #banket, #reklamalar
  const deep = (location.hash || "").replace("#", "");
  if (TITLES[deep]) {
    film.muted = true;
    const openDeep = () => { if (deep === "qr") openHub(); else enter(["menyu", "reklamalar", "banket"].indexOf(deep), deep); };
    let settled = false, logoDone = deep === "reklamalar" || deep === "kartochka" || reduce;   // adverts already begin with the logo
    const tryOpen = () => { if (settled && logoDone) openDeep(); };
    const go = () => toEnd(() => { rest(UI_END + 0.1); settled = true; tryOpen(); });
    if (film.readyState >= 1) go(); else film.addEventListener("loadedmetadata", go, { once: true });
    if (!logoDone) {
      // the guest scanned a table card: the NoZi logo film first, then the section
      const li = $("logoIntro"), lf = $("logoFilm");
      li.hidden = false;
      const finish = () => {
        if (logoDone) return;
        logoDone = true;
        li.classList.add("out");
        setTimeout(() => { lf.pause(); li.hidden = true; }, 750);
        tryOpen();
      };
      $("liSkip").textContent = deep === "banket" ? "Banketga o‘tish" : deep === "qr" ? "Davom etish" : "Menyuga o‘tish";
      $("liSkip").addEventListener("click", finish);
      $("liSound").addEventListener("click", () => {
        lf.muted = !lf.muted;
        $("liSound").setAttribute("aria-pressed", String(!lf.muted));
        $("liSound").textContent = lf.muted ? "Ovozni yoqish" : "Ovozni o‘chirish";
        if (lf.paused) lf.play().catch(() => {});
      });
      lf.addEventListener("ended", finish);
      lf.addEventListener("error", finish);
      const p = lf.play();
      // if the phone refuses to play, go straight to the menu rather than keep the guest waiting
      if (p && p.catch) p.catch(finish);
      setTimeout(finish, 15000);
    }
  } else if (reduce) { skipBtn.click(); } else { film.muted = true; start(); }
  requestAnimationFrame(loop);
})();
</script>
